  Game: Quick Math
  Mechanic: Solve missing-number equations by tapping one of four answers. Adaptive difficulty.
  Target time: 30-70 seconds
  Scoring: Speed x difficulty multiplier. 3 strikes = game over. High score = ramp fast + stay accurate.
-->

const DARK_PALETTE = {

  RESULT_GLOW: 'rgba(240,187,30,0.35)', EMPTY_RESULT: 'rgba(240,238,245,0.12)',

const LIGHT_PALETTE = {

  GREEN: '#2d9e3f', RED: '#d93636', ORANGE: '#d47219', WHITE: '#1a1a2e',
  DIM: '#8b8596', BTN_BG: '#ffffff', BTN_BORDER: '#d1cce6',
  BTN_CORRECT: '#dcfce7', BTN_WRONG: '#fee2e2', LETTERBOX: '#F2F0EF',
  DOCK_BG: '#eae8e6', DOCK_BORDER: '#d5d0e0', BAR_BG: '#E5E2DF',
  EMPTY_DOT: '#bfb9d0', EMPTY_HEART: '#c5bdd4',
  CORRECT_TXT: '#166534', WRONG_TXT: '#991b1b',
  GRAD_0: '#fdf9f4', GRAD_55: 'rgba(253,249,244,0.18)', GRAD_1: 'rgba(253,249,244,0)',
  RESULT_GLOW: 'rgba(232,173,10,0.35)', EMPTY_RESULT: 'rgba(26,26,46,0.12)',
  HERO_BLOOM_A: 0.12, RING_GLOW_A: 0.06
};

let BG, ACC, ACC2, GOLD, GREEN, RED, ORANGE, WHITE, DIM;
let BTN_BG, BTN_BORDER, BTN_CORRECT, BTN_WRONG, LETTERBOX;
let DOCK_BG, DOCK_BORDER, BAR_BG, EMPTY_DOT, EMPTY_HEART;
let CORRECT_TXT, WRONG_TXT;
let GRAD_0, GRAD_55, GRAD_1;
let RESULT_GLOW, EMPTY_RESULT;
let HERO_BLOOM_A, RING_GLOW_A;

let _currentTheme = 'dark';
function applyTheme(theme) {
  _currentTheme = theme;
  const p = theme === 'light' ? LIGHT_PALETTE : DARK_PALETTE;
  BG = p.BG; ACC = p.ACC; ACC2 = p.ACC2; GOLD = p.GOLD;
  GREEN = p.GREEN; RED = p.RED; ORANGE = p.ORANGE; WHITE = p.WHITE;
  DIM = p.DIM; BTN_BG = p.BTN_BG; BTN_BORDER = p.BTN_BORDER;
  BTN_CORRECT = p.BTN_CORRECT; BTN_WRONG = p.BTN_WRONG; LETTERBOX = p.LETTERBOX;
  DOCK_BG = p.DOCK_BG; DOCK_BORDER = p.DOCK_BORDER; BAR_BG = p.BAR_BG;
  EMPTY_DOT = p.EMPTY_DOT; EMPTY_HEART = p.EMPTY_HEART;
  CORRECT_TXT = p.CORRECT_TXT; WRONG_TXT = p.WRONG_TXT;
  GRAD_0 = p.GRAD_0; GRAD_55 = p.GRAD_55; GRAD_1 = p.GRAD_1;
  RESULT_GLOW = p.RESULT_GLOW; EMPTY_RESULT = p.EMPTY_RESULT;
  HERO_BLOOM_A = p.HERO_BLOOM_A; RING_GLOW_A = p.RING_GLOW_A;
  document.body.style.background = BG;
  // Rebuild bgCache on next frame
  bgCache = null; needsResize = true;
}

// ── Adaptive timer ──
const TIME_LIMIT_FLOOR = 3200;
const TIME_LIMIT_CEILING = 6000;
const TIME_LIMIT_SHRINK = 100;
const TIME_LIMIT_GROW = 300;
let currentTimeLimit = TIME_LIMIT_CEILING;

let W, H, dpr, VW, VH, VX, VY, u;
let bgCache = null;
let lastRW = 0, lastRH = 0;
let needsResize = true;
const MAX_ASPECT = 9 / 16;

function applyResize() {
  if (!needsResize) return;
  needsResize = false;
  const rw = lastRW, rh = lastRH;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = rw * dpr; canvas.height = rh * dpr;
  canvas.style.width = rw + 'px'; canvas.style.height = rh + 'px';
  if (rw / rh > MAX_ASPECT) {
    VW = Math.round(rh * MAX_ASPECT); VH = rh;
    VX = Math.round((rw - VW) / 2); VY = 0;
  } else { VW = rw; VH = rh; VX = 0; VY = 0; }
  if (VW > 430) { VW = 430; VX = Math.round((rw - VW) / 2); }
  W = VW; H = VH; u = Math.min(W, H);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!bgCache) bgCache = document.createElement('canvas');
  bgCache.width = W * dpr; bgCache.height = H * dpr;
  const _bc = bgCache.getContext('2d');
  _bc.setTransform(dpr, 0, 0, dpr, 0, 0);
  _bc.fillStyle = BG; _bc.fillRect(0, 0, W, H);
  const _gr = _bc.createRadialGradient(W / 2, 0, 0, W / 2, 0, W / 2);
  _gr.addColorStop(0, GRAD_0);
  _gr.addColorStop(0.55, GRAD_55);
  _gr.addColorStop(1, GRAD_1);
  _bc.save(); _bc.scale(1, (H * 0.55) / (W / 2));
  _bc.fillStyle = _gr; _bc.fillRect(0, 0, W, W / 2);
  _bc.restore();
}
function onWindowResize() {
  const rw = window.innerWidth, rh = window.innerHeight;
  if (rw === lastRW && rh === lastRH) return;
  lastRW = rw; lastRH = rh;
  needsResize = true;
}
window.addEventListener('resize', onWindowResize);
lastRW = window.innerWidth; lastRH = window.innerHeight;
applyTheme(window.STRYM && window.STRYM.theme || 'dark');
applyResize();

// ── Strym SDK: theme detection ──
window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'STRYM_START' && e.data.theme) {
    applyTheme(e.data.theme);
  }
});

// ── Audio (pre-rendered PCM buffers) ──
const SFX = {
  ctx: null,
  _b: {},
  _unlocked: false,

  init() {
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); this._gen(); } catch (e) {}
  },

  unlock() {
    if (!this.ctx) this.init();
    if (!this.ctx) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    if (!this._unlocked) {
      const buf = this.ctx.createBuffer(1, 1, this.ctx.sampleRate);
      const src = this.ctx.createBufferSource();
      src.buffer = buf; src.connect(this.ctx.destination); src.start(0);
      this._unlocked = true;
    }
  },

  _pcm(dur, fn) {
    const sr = this.ctx.sampleRate, n = Math.ceil(sr * dur);
    const buf = this.ctx.createBuffer(1, n, sr);
    fn(buf.getChannelData(0), sr, n);
    return buf;
  },

  _addSine(d, sr, freq, start, dur, vol, decayT) {
    const s = Math.floor(start * sr), len = Math.ceil(dur * sr);
    for (let i = 0; i < len && s + i < d.length; i++) {
      const t = i / sr;
      d[s + i] += Math.sin(2 * Math.PI * freq * t) * vol * Math.exp(-t / decayT);
    }
  },

  _addTri(d, sr, freq, start, dur, vol, decayT) {
    const s = Math.floor(start * sr), len = Math.ceil(dur * sr);
    for (let i = 0; i < len && s + i < d.length; i++) {
      const t = i / sr;
      const phase = (freq * t) % 1;
      d[s + i] += (4 * Math.abs(phase - 0.5) - 1) * vol * Math.exp(-t / decayT);
    }
  },

  _addBell(d, sr, freq, start, dur, vol) {
    const P = [1.0, 2.76, 5.4, 8.93], G = [1.0, 0.4, 0.15, 0.06];
    P.forEach((ratio, i) => {
      const f = freq * ratio * (1 + (Math.random() - 0.5) * 0.005);
      this._addSine(d, sr, f, start, dur * (1 - i * 0.15), vol * G[i], dur * 0.35 * (1 - i * 0.1));
    });
  },

  _addNoise(d, sr, start, dur, vol, decayT) {
    const s = Math.floor(start * sr), len = Math.ceil(dur * sr);
    for (let i = 0; i < len && s + i < d.length; i++) {
      const t = i / sr;
      d[s + i] += (Math.random() * 2 - 1) * vol * Math.exp(-t / (decayT || dur * 0.3));
    }
  },

  _addChime(d, sr, freq, start, dur, vol) {
    const s = Math.floor(start * sr), len = Math.ceil(dur * sr);
    const attackLen = Math.ceil(0.008 * sr);
    for (let i = 0; i < len && s + i < d.length; i++) {
      const t = i / sr;
      const env = i < attackLen ? (i / attackLen) : Math.exp(-(t - 0.008) / (dur * 0.35));
      d[s + i] += Math.sin(2 * Math.PI * freq * t) * vol * env;
    }
  },

  _addSweep(d, sr, startFreq, endFreq, start, dur, vol, type) {
    const s = Math.floor(start * sr), len = Math.ceil(dur * sr);
    let phase = 0;
    for (let i = 0; i < len && s + i < d.length; i++) {
      const t = i / sr, p = t / dur;
      const freq = startFreq * Math.pow(endFreq / startFreq, p);
      phase += freq / sr;
      const wave = type === 'tri' ? (4 * Math.abs(phase % 1 - 0.5) - 1) : Math.sin(2 * Math.PI * phase);
      d[s + i] += wave * vol * Math.exp(-t / (dur * 0.4));
    }
  },

  _gen() {
    const B = this._b, me = this;

    B.correct = me._pcm(0.25, (d, sr) => {
      me._addChime(d, sr, 523.3, 0, 0.12, 0.12);
      me._addChime(d, sr, 659.3, 0.06, 0.15, 0.14);
    });

    B.wrong = me._pcm(0.3, (d, sr) => {
      me._addTri(d, sr, 200, 0, 0.2, 0.10, 0.08);
      me._addTri(d, sr, 160, 0.08, 0.22, 0.08, 0.08);
      me._addNoise(d, sr, 0, 0.05, 0.03, 0.02);
    });

    B.lifeLost = me._pcm(0.5, (d, sr) => {
      me._addSweep(d, sr, 400, 120, 0, 0.4, 0.10, 'tri');
      me._addNoise(d, sr, 0, 0.08, 0.04, 0.02);
    });

    B.streak5 = me._pcm(0.5, (d, sr) => {
      [600, 680, 760, 840, 920].forEach((f, i) => me._addChime(d, sr, f, i * 0.04, 0.08, 0.08));
    });
    B.streak10 = me._pcm(0.6, (d, sr) => {
      [600, 720, 840, 960, 1080].forEach((f, i) => me._addChime(d, sr, f, i * 0.04, 0.10, 0.10));
      me._addBell(d, sr, 1200, 0.22, 0.3, 0.08);
    });
    B.streak15 = me._pcm(0.7, (d, sr) => {
      [523, 659, 784, 880, 1047, 1175, 1319].forEach((f, i) => me._addChime(d, sr, f, i * 0.035, 0.10, 0.09));
      me._addBell(d, sr, 1319, 0.28, 0.35, 0.10);
    });
    B.streak20 = me._pcm(0.8, (d, sr) => {
      [523, 659, 784, 880, 1047, 1175, 1319, 1568].forEach((f, i) => me._addChime(d, sr, f, i * 0.03, 0.12, 0.10));
      me._addBell(d, sr, 1568, 0.30, 0.4, 0.12);
    });

    B.bigScore = me._pcm(0.35, (d, sr) => {
      me._addChime(d, sr, 523.3, 0, 0.10, 0.06);
      me._addChime(d, sr, 659.3, 0.03, 0.10, 0.06);
      me._addChime(d, sr, 784.0, 0.06, 0.14, 0.08);
    });
    B.bigScoreHigh = me._pcm(0.4, (d, sr) => {
      me._addChime(d, sr, 523.3, 0, 0.10, 0.06);
      me._addChime(d, sr, 659.3, 0.03, 0.10, 0.06);
      me._addChime(d, sr, 784.0, 0.06, 0.12, 0.08);
      me._addChime(d, sr, 1047, 0.09, 0.18, 0.07);
    });

    B.gameOver = me._pcm(1.2, (d, sr) => {
      [392, 330, 294, 262].forEach((f, i) => me._addBell(d, sr, f, i * 0.15, 0.45, 0.10));
      me._addNoise(d, sr, 0.4, 0.2, 0.02, 0.06);
    });

    B.win = me._pcm(1.8, (d, sr) => {
      [523, 659, 784, 1047].forEach((f, i) => me._addBell(d, sr, f, i * 0.12, 0.5, 0.10));
      me._addBell(d, sr, 1319, 0.50, 0.6, 0.08);
      me._addBell(d, sr, 1568, 0.55, 0.5, 0.06);
      me._addNoise(d, sr, 0.4, 0.15, 0.03, 0.05);
    });

    B.hint = me._pcm(0.2, (d, sr) => {
      me._addChime(d, sr, 880, 0, 0.15, 0.06);
      me._addSine(d, sr, 1760, 0, 0.08, 0.03, 0.04);
    });

    B.timeout = me._pcm(0.3, (d, sr) => {
      me._addSweep(d, sr, 800, 300, 0, 0.25, 0.08, 'tri');
      me._addNoise(d, sr, 0, 0.04, 0.03, 0.01);
    });
  },

  _play(buf, vol, rate) {
    if (!this.ctx || !buf) return;
    try {
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      if (rate && rate !== 1) src.playbackRate.value = rate;
      const g = this.ctx.createGain();
      g.gain.value = vol || 0.4;
      src.connect(g); g.connect(this.ctx.destination);
      src.onended = () => { src.disconnect(); g.disconnect(); };
      src.start();
    } catch (e) {}
  },

  correct(stk) { this._play(this._b.correct, 0.4, 1 + Math.min(stk || 0, 10) * 0.02); },
  wrong() { this._play(this._b.wrong, 0.4, 1); },
  lifeLost() { this._play(this._b.lifeLost, 0.45, 1); },
  streak(n) {
    if (n >= 20) this._play(this._b.streak20, 0.4, 1);
    else if (n >= 15) this._play(this._b.streak15, 0.4, 1);
    else if (n >= 10) this._play(this._b.streak10, 0.4, 1);
    else this._play(this._b.streak5, 0.4, 1);
  },
  bigScore(pts) {
    if (pts >= 1200) this._play(this._b.bigScoreHigh, 0.35, 1);
    else if (pts >= 800) this._play(this._b.bigScore, 0.35, 1);
  },
  gameOver() { this._play(this._b.gameOver, 0.45, 1); },
  win() { this._play(this._b.win, 0.45, 1); },
  hintReveal() { this._play(this._b.hint, 0.3, 1); },
  timeout() { this._play(this._b.timeout, 0.35, 1); }
};

function vib(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

// ── State ──
let state = 'ready';
let round = 0, score = 0, streak = 0, maxStreak = 0, lives = MAX_LIVES;
let results = [];
let equation = null, roundStartTime = 0, feedbackTimer = 0, feedbackResult = null;
let shakeX = 0, shakeY = 0;
let floatingTexts = [], milestoneText = '', milestoneAlpha = 0, milestoneHold = 0, milestoneScale = 1;
let diffLabelPulse = 0;
let timeBarPct = 1, animFrame = 0, btnRects = [], feedbackBarColor = '#f0bb1e', feedbackBarStart = 1;
let lastFrameTime = 0;
let diffLevel = 0, maxDiffLevel = 0;
const DIFF_NAMES = ['Easy', 'Medium', 'Hard', 'Expert'];
const DIFF_COLORS_MAP = [GREEN, ACC, ORANGE, RED];
let gameStartTime = 0;

// Visual feedback systems
let particles = [];
let rings = [];
let confetti = [];
let flashAlpha = 0, flashColor = WHITE;
let displayScore = 0;
let scorePop = 0;

// Hint system
let hintsGiven = 0;

// ── CTA pools (non-repeating motivational callouts) ──
const CTA_FAST = ['BLAZING!', 'ON FIRE!', 'LIGHTNING!', 'INCREDIBLE!', 'GENIUS!', 'INSANE!', 'CRUSHING IT!', 'UNREAL!', 'FLAWLESS!', 'UNSTOPPABLE!'];
const CTA_OK = ['NICE!', 'SOLID!', 'CORRECT!', 'YES!', 'SMOOTH!', 'SHARP!', 'CLEAN!', 'RIGHT!', 'SWEET!', 'NAILED IT!'];
const CTA_SLOW = ['PHEW!', 'MADE IT!', 'JUST IN TIME!', 'CLOSE ONE!', 'SQUEAKED IN!'];
const CTA_MISS = ['SHAKE IT OFF!', 'NEXT ONE!', 'KEEP GOING!', 'YOU GOT THIS!', 'STAY SHARP!', 'BOUNCE BACK!', 'ALMOST!'];
let ctaIdx = { fast: 0, ok: 0, slow: 0, miss: 0 };
function shuffleCTAs() {
  [CTA_FAST, CTA_OK, CTA_SLOW, CTA_MISS].forEach(a => {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  });
  ctaIdx = { fast: 0, ok: 0, slow: 0, miss: 0 };
}
function nextCTA(tier) {
  const pools = { fast: CTA_FAST, ok: CTA_OK, slow: CTA_SLOW, miss: CTA_MISS };
  const arr = pools[tier] || CTA_OK;
  return arr[ctaIdx[tier]++ % arr.length];
}

// Equation entrance animation
let roundEntryAlpha = 1, roundEntryOffset = 0;
// Button tap feedback
let correctBtnPop = 0, wrongBtnShake = 0, feedbackBtnIdx = -1;

// ── Starburst spark VFX system ──
let bursts = []; // radial light ray bursts

function drawStar4(x, y, r, rot) {
  const c = Math.cos(rot), s = Math.sin(rot);
  const rc = r * c, rs = r * s, ac = r * 0.28 * c, as = r * 0.28 * s;
  ctx.beginPath();
  ctx.moveTo(x + rs, y - rc); ctx.lineTo(x + ac, y + as);
  ctx.lineTo(x - rs, y + rc); ctx.lineTo(x - ac, y - as);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x - rc, y - rs); ctx.lineTo(x - as, y + ac);
  ctx.lineTo(x + rc, y + rs); ctx.lineTo(x + as, y - ac);
  ctx.closePath(); ctx.fill();
}

function spawnParticles(x, y, count, color, spread, speed) {
  // Size hierarchy: first 25% hero, next 35% medium, rest tiny
  for (let i = 0; i < count && particles.length < 150; i++) {
    const angle = Math.random() * Math.PI * 2;
    const vel = (0.6 + Math.random()) * speed;
    const tier = i / count;
    const size = tier < 0.25 ? 6 + Math.random() * 3 :
                 tier < 0.6  ? 3 + Math.random() * 2 :
                               1.5 + Math.random() * 1;
    const hasTrail = tier < 0.6;
    particles.push({
      x, y, vx: Math.cos(angle) * vel, vy: Math.sin(angle) * vel - 0.5,
      life: 1, size, color, gravity: 0.03 + Math.random() * 0.02,
      rot: Math.random() * Math.PI * 2, rotV: 0.05 + Math.random() * 0.15,
      scale: 0.5, hero: tier < 0.25, trail: hasTrail,
      px: x, py: y, px2: x, py2: y
    });
  }
}
function spawnRing(x, y, color, maxR, width) {
  if (rings.length >= 20) return;
  rings.push({ x, y, r: 0, maxR, alpha: 0.8, color, baseW: width || 4, speed: maxR / 24 });
}
function spawnBurst(x, y, color, maxR, alpha) {
  if (bursts.length >= 4) return;
  bursts.push({ x, y, innerR: 0, outerR: u * 0.04, maxR, alpha: alpha || 0.15, rot: Math.random() * 0.5, age: 0 });
  bursts[bursts.length - 1].color = color;
}
function spawnScoreFeedback(pts, tier, dl) {
  const cx = W / 2, cy = H * 0.48;
  const intensity = pts / 1500;
  const colors = { fast: GOLD, ok: GREEN, slow: RED };
  const c = colors[tier] || GREEN;

  const pCount = Math.round(4 + intensity * 8);
  const pSpeed = 2.0 + intensity * 4;
  spawnParticles(cx, cy, pCount, c, 1, pSpeed);

  // Shockwave ring + echo
  const ringR = u * (0.12 + intensity * 0.18);
  spawnRing(cx, cy, c, ringR, 4 + intensity * 4);
  spawnRing(cx, cy, c, ringR * 0.85, 2); // echo

  // Radial light rays
  spawnBurst(cx, cy, c, u * (0.22 + intensity * 0.08), 0.12 + intensity * 0.08);

  scorePop = 0.15 + intensity * 0.25;
}

// ── Confetti system ──
function spawnConfetti(count) {
  count = Math.min(count, 200 - confetti.length);
  const perWave = Math.ceil(count / 4);
  const palette = [GOLD, ACC, GREEN, '#e84393', ORANGE, '#00b894'];
  const now = performance.now();
  for (let wave = 0; wave < 4; wave++) {
    for (let i = 0; i < perWave && confetti.length < 200; i++) {
      confetti.push({
        x: Math.random() * W,
        y: -10 - Math.random() * 40,
        vx: (Math.random() - 0.5) * 3,
        vy: 1.5 + Math.random() * 2,
        size: 5 + Math.random() * 8,
        color: palette[Math.floor(Math.random() * palette.length)],
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.15,
        alpha: 1,
        shape: Math.random() < 0.5 ? 'rect' : 'circle',
        delay: wave * 250 + Math.random() * 200,
        born: now,
        life: 3000
      });
    }
  }
}

// ── Hint system ──

      const refillT = feedbackBarStart < 0.99 ? Math.min(1, (timeBarPct - feedbackBarStart) / (1 - feedbackBarStart)) : 1;
      bc = lerpColor(feedbackBarColor, GOLD, refillT);
    } else {
      // Smooth color blend instead of discrete jumps
      const pct = elMs / currentTimeLimit;
      if (pct < 0.28) bc = GOLD;
      else if (pct < 0.38) bc = lerpColor(GOLD, GREEN, (pct - 0.28) / 0.10);
      else if (pct < 0.70) bc = GREEN;
      else if (pct < 0.80) bc = lerpColor(GREEN, RED, (pct - 0.70) / 0.10);
      else bc = RED;
    }
    const fillW = barW * timeBarPct;
    ctx.fillStyle = bc;
    roundRect(bx, y, fillW, barH, barH / 2);
    ctx.fill();
  }
  y += barH + u * 0.03;

  // Progress dots
  const totalDots = TOTAL_ROUNDS;
  const maxDotsW = Math.min(W * 0.82, 380);
  const dotGap = maxDotsW / totalDots;
  const dotStartX = cx - (totalDots * dotGap) / 2;
  const dotR = Math.max(Math.min(dotGap * 0.3, 4), 2.5);
  for (let i = 0; i < totalDots; i++) {
    const dx = dotStartX + i * dotGap + dotGap / 2;
    if (i < results.length) {
      drawResultDot(dx, y, dotR, results[i].tier);
    } else if (i === results.length) {
      ctx.fillStyle = ACC; ctx.beginPath(); ctx.arc(dx, y, dotR, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = EMPTY_DOT; ctx.beginPath(); ctx.arc(dx, y, dotR, 0, Math.PI * 2); ctx.fill();
    }
  }
  y += u * 0.05;

  // Answer buttons (2x2) — compute first so we can center equation in the gap
  const btnAreaTop = H * 0.55, btnAreaBottom = dockY - u * 0.03;
  const btnTotalW = Math.min(W * 0.85, 400), btnGapV = u * 0.025;
  const bw = (btnTotalW - btnGapV) / 2;
  const bh = Math.min((btnAreaBottom - btnAreaTop - btnGapV) / 2, u * 0.16);
  const bStartX = cx - btnTotalW / 2, bStartY = btnAreaTop;

  // Equation — centered in the gap between dots and buttons (more room without diff label above)
  const eqFS = u * 0.095;
  const eqY = y + (btnAreaTop - y) * 0.45;

  // Entrance animation: fade + slide up (fast: 2 frames to avoid desync with buttons)
  if (roundEntryAlpha < 1) roundEntryAlpha = Math.min(1, roundEntryAlpha + 0.12);
  if (roundEntryOffset > 0.1) roundEntryOffset *= 0.80; else roundEntryOffset = 0;
  ctx.globalAlpha = roundEntryAlpha;
  fillText(equation.display, cx, eqY + roundEntryOffset, eqFS, WHITE, 'center', '700');

  // Draw buttons
  btnRects.length = 0;
  for (let i = 0; i < 4; i++) {
    const col = i % 2, row = Math.floor(i / 2);
    const rx = bStartX + col * (bw + btnGapV), ry = bStartY + row * (bh + btnGapV) + roundEntryOffset;

    // Hint system: hinted buttons shrink+fade then disappear
    if (hintedButtons.has(i) && state !== 'feedback') {
      const anim = hintAnimations.find(a => a.idx === i);
      const progress = anim ? Math.min(1, (now - anim.startTime) / anim.duration) : 1;
      if (progress >= 1) continue;
      const scale = 1 - progress * 0.3;
      ctx.globalAlpha = 1 - progress;
      ctx.save();
      ctx.translate(rx + bw / 2, ry + bh / 2);
      ctx.scale(scale, scale);
      roundRect(-bw / 2, -bh / 2, bw, bh, u * 0.02); ctx.fillStyle = BTN_BG; ctx.fill();
      ctx.strokeStyle = BTN_BORDER; ctx.lineWidth = 2; ctx.stroke();
      fillText(equation.options[i].toString(), 0, 0, u * 0.065, DIM, 'center', '700');
      ctx.restore(); _lastFont = '';
      ctx.globalAlpha = 1;
      continue;
    }
    if (hintedButtons.has(i) && state === 'feedback') continue;

    let bg = BTN_BG, border = BTN_BORDER, txtColor = WHITE;
    let btnScale = 1, btnOffsetX = 0;
    if (state === 'feedback' && feedbackResult) {
      if (i === equation.correctIdx) {
        bg = BTN_CORRECT; border = GREEN; txtColor = CORRECT_TXT;
        if (i === feedbackBtnIdx && correctBtnPop > 0) btnScale = 1 + correctBtnPop * 0.006;
      }
      else if (i === feedbackResult.chosenIdx && !feedbackResult.correct) {
        bg = BTN_WRONG; border = RED; txtColor = WRONG_TXT;
        if (i === feedbackBtnIdx && wrongBtnShake > 0) btnOffsetX = Math.sin(wrongBtnShake * 2.5) * 5;
      }
      else ctx.globalAlpha = 0.4;
    }
    if (btnScale !== 1 || btnOffsetX !== 0) {
      ctx.save();
      ctx.translate(rx + bw / 2 + btnOffsetX, ry + bh / 2);
      ctx.scale(btnScale, btnScale);
      roundRect(-bw / 2, -bh / 2, bw, bh, u * 0.02); ctx.fillStyle = bg; ctx.fill();
      ctx.strokeStyle = border; ctx.lineWidth = 2; ctx.stroke(); ctx.globalAlpha = roundEntryAlpha;
      fillText(equation.options[i].toString(), 0, 0, u * 0.065, txtColor, 'center', '700');
      ctx.restore(); _lastFont = '';
    } else {
      roundRect(rx, ry, bw, bh, u * 0.02); ctx.fillStyle = bg; ctx.fill();
      ctx.strokeStyle = border; ctx.lineWidth = 2; ctx.stroke(); ctx.globalAlpha = roundEntryAlpha;
      fillText(equation.options[i].toString(), rx + bw / 2, ry + bh / 2, u * 0.065, txtColor, 'center', '700');
    }
    btnRects.push({ x: rx, y: ry, w: bw, h: bh, idx: i });
  }
  ctx.globalAlpha = 1;
}

// ── Draw: Game Over ──
function drawGameOver() {
  const cx = W / 2, grade = getGrade(score), gc = gradeColor(grade);
  const correct = goCorrect, avgTime = goAvgTime;
  const eliminated = lives <= 0;

  // ── Fixed anchors ──
  const btnH = u * 0.13;
  const by = H - u * 0.065 - btnH;
  const topSafeY = Math.max(28, H * 0.045);

  // ── Font sizes ──
  const gradeFS = grade.length > 10 ? u * 0.068 : grade.length > 6 ? u * 0.084 : u * 0.10;
  const scoreFS = u * 0.14;
  const ptsFS = u * 0.045;
  const statValueFS = u * 0.058;
  const statLabelFS = u * 0.03;
  const statLabelOffset = u * 0.058;
  const statRowH = statLabelOffset + statLabelFS * 0.5 + statValueFS * 0.5;
  const statRowGap = u * 0.04;
  const statsBlockH = statRowH * 2 + statRowGap;
  const dotsH = 12;

  // ── Generous spacing ──
  const sp1 = u * 0.04;  // grade -> score
  const sp2 = u * 0.05;  // score line -> stats
  const sp3 = u * 0.07;  // stats -> dots

  // ── Measure + center ──
  const totalH = gradeFS + sp1 + scoreFS + sp2 + statsBlockH + sp3 + dotsH;
  const availH = by - u * 0.04 - topSafeY;
  const startY = topSafeY + (availH - totalH) * 0.4;

  // ── ELIMINATED — pinned to top, independent ──
  if (eliminated) {
    fillText('ELIMINATED', cx, topSafeY + u * 0.025, u * 0.046, RED, 'center', '700');
  }

  // ── Grade — emotional hero ──
  let y = startY + gradeFS / 2;
  fillText(grade, cx, y, gradeFS, gc, 'center', '800');

  // ── Score + "pts" on one line ──
  y += gradeFS / 2 + sp1 + scoreFS / 2;
  const scoreStr = fmtNum(score);
  fillText(scoreStr, cx, y, scoreFS, WHITE, 'center', '800');
  ctx.font = '800 ' + Math.round(scoreFS) + 'px ' + FONT;
  const scoreW = ctx.measureText(scoreStr).width;
  fillText('pts', cx + scoreW / 2 + u * 0.015, y + scoreFS * 0.18, ptsFS, DIM, 'left', '600');

  // ── Stats 2x2 grid ──
  y += scoreFS / 2 + sp2 + statValueFS / 2;
  const statsTopY = y;
  const stats = [
    { label: 'SOLVED', value: correct.toString(), color: correct >= results.length - 1 ? GREEN : correct >= results.length * 0.7 ? ACC : ORANGE },
    { label: 'AVG TIME', value: avgTime > 0 ? avgTime + 'ms' : '\u2014', color: avgTime < 1000 ? GREEN : avgTime < 2000 ? ACC : ORANGE },
    { label: 'STREAK', value: goMaxStreak.toString(), color: goMaxStreak >= 10 ? GOLD : goMaxStreak >= 5 ? GREEN : ACC },
    { label: 'PEAK DIFF', value: DIFF_NAMES[maxDiffLevel], color: ACC },
  ];
  const gridW = Math.min(W * 0.85, 380), colW = gridW / 2, gx = cx - gridW / 2;
  for (let i = 0; i < stats.length; i++) {
    const col = i % 2, row = Math.floor(i / 2);
    const rowValueY = statsTopY + row * (statRowH + statRowGap);
    const sx = gx + col * colW + colW / 2;
    fillText(stats[i].value, sx, rowValueY, statValueFS, stats[i].color, 'center', '700');
    fillText(stats[i].label, sx, rowValueY + statLabelOffset, statLabelFS, DIM, 'center', '600');
  }

  // ── Progress dots ──
  const dotsY = statsTopY + statsBlockH - statValueFS * 0.5 + sp3 + dotsH / 2;
  const cnt = results.length;
  const maxDotsW = Math.min(W * 0.82, 380);
  const dg = cnt > 0 ? maxDotsW / cnt : maxDotsW;
  const dsx = cx - (cnt * dg) / 2;
  const dr = Math.max(Math.min(dg * 0.3, 5.5), 3);
  for (let i = 0; i < cnt; i++) drawResultDot(dsx + i * dg + dg / 2, dotsY, dr, results[i].tier);

  // ── Buttons ──
  const btnW = Math.min(W * 0.38, 180), bg2 = u * 0.03;
  const totalBtnW = btnW * 2 + bg2, lx = cx - totalBtnW / 2;
  roundRect(lx, by, btnW, btnH, btnH / 2); ctx.fillStyle = ACC2; ctx.fill();
  fillText('Play Again', lx + btnW / 2, by + btnH / 2, u * 0.038, '#ffffff', 'center', '700');
  roundRect(lx + btnW + bg2, by, btnW, btnH, btnH / 2); ctx.fillStyle = BTN_BG; ctx.fill();
  ctx.strokeStyle = BTN_BORDER; ctx.lineWidth = 2; ctx.stroke();
  fillText('Share', lx + btnW + bg2 + btnW / 2, by + btnH / 2, u * 0.038, ACC, 'center', '700');

  // ── Seed code — small, below buttons ──
  fillText('#' + seedToCode(gameSeed), cx, by + btnH + u * 0.035, u * 0.028, DIM, 'center', '500');

  btnRects = [
    { x: lx, y: by, w: btnW, h: btnH, action: 'again' },
    { x: lx + btnW + bg2, y: by, w: btnW, h: btnH, action: 'share' }
  ];
}

// ── Sharing ──
function shareResults() {
  const grade = getGrade(score);
  const correct = results.filter(r => r.correct).length;
  const cR = results.filter(r => r.correct);
  const avgTime = cR.length ? Math.round(cR.reduce((s, r) => s + r.time, 0) / cR.length) : 0;
  const code = seedToCode(gameSeed);
  const dots = results.map(r => r.tier === 'fast' ? '\u{1f48e}' : r.tier === 'ok' ? '\u{1f7e2}' : r.tier === 'slow' ? '\u{1f534}' : '\u274c').join('');
  const text = `\u{1f9ee} Quick Math #${code}\n\n${grade} \u2014 ${score} pts\n\n\u23f1 Avg: ${avgTime}ms\n\u2713 ${correct} solved\n\u{1f525} Streak: ${maxStreak}\n\u{1f4c8} Peak: ${DIFF_NAMES[maxDiffLevel]}\n\n${dots}`;

  // Strym SDK: share via parent
  if (_inStrym()) {
    _strymPost({ type: 'STRYM_SHARE', text: text });
    return;
  }

  // Fallback: native share or clipboard
  if (navigator.share) { navigator.share({ text }).catch(() => {}); return; }
  try {
    const ta = document.createElement('textarea'); ta.value = text;
    ta.style.cssText = 'position:fixed;left:0;top:0;opacity:0.01;width:1px;height:1px';
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy'); document.body.removeChild(ta);
    if (ok) { showMilestone('Copied!'); return; }
  } catch (e) {}
  try { navigator.clipboard.writeText(text).then(() => showMilestone('Copied!')).catch(() => {}); } catch (e) {}
}

// ── Floating text & milestones ──
function drawFloatingTexts() {
  let i = 0;
  while (i < floatingTexts.length) {
    const ft = floatingTexts[i];
    // Delay: skip update+draw until delay exhausted
    if (ft.delay > 0) { ft.delay--; i++; continue; }
    // Fly phase: move while flyFrames > 0, then stop in place
    if (ft.flyFrames === undefined || ft.flyFrames > 0) {
      ft.y += ft.vy;
      if (ft.flyFrames !== undefined) ft.flyFrames--;
    }
    // Scale pop-out: 0.5 -> overshoot 1.12 -> settle 1.0
    if (ft.scale !== undefined && ft.scale !== 1) {
      if (ft.age === undefined) ft.age = 0;
      ft.age++;
      if (ft.age <= 6) {
        ft.scale += (1.12 - ft.scale) * 0.35;
      } else {
        ft.scale += (1 - ft.scale) * 0.2;
        if (Math.abs(ft.scale - 1) < 0.01) ft.scale = 1;
      }
    }
    // Hold at full alpha, then fade
    if (ft.hold > 0) {
      ft.hold--;
    } else {
      ft.alpha -= ft.fadeRate || 0.012;
    }
    if (ft.alpha <= 0) {
      floatingTexts[i] = floatingTexts[floatingTexts.length - 1]; floatingTexts.pop(); continue;
    }
    ctx.globalAlpha = ft.alpha;
    const s = ft.scale || 1;
    const fs = u * (ft.size || 0.045);
    if (s !== 1) {
      ctx.save(); ctx.translate(ft.x, ft.y); ctx.scale(s, s);
      fillText(ft.text, 0, 0, fs, ft.color, 'center', '800');
      ctx.restore(); _lastFont = '';
    } else {
      fillText(ft.text, ft.x, ft.y, fs, ft.color, 'center', '700');
    }
    ctx.globalAlpha = 1;
    i++;
  }
  if (floatingTexts.length > 15) floatingTexts.length = 15;
}
function drawMilestone() {
  if (milestoneAlpha <= 0) return;
  const cx = W / 2, my = H * 0.42;
  milestoneScale += (1 - milestoneScale) * 0.15;
  ctx.globalAlpha = milestoneAlpha;
  ctx.save(); ctx.translate(cx, my); ctx.scale(milestoneScale, milestoneScale);
  fillText(milestoneText, 0, 0, u * 0.055, GOLD, 'center', '800');
  ctx.restore(); _lastFont = '';
  ctx.globalAlpha = 1;
  if (milestoneHold > 0) { milestoneHold--; }
  else { milestoneAlpha -= 0.035; if (milestoneAlpha < 0) milestoneAlpha = 0; }
}

function drawParticles() {
  let i = 0;
  while (i < particles.length) {
    const p = particles[i];
    // Store previous positions for trails
    p.px2 = p.px; p.py2 = p.py; p.px = p.x; p.py = p.y;
    // Physics: drag + low gravity
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.92; p.vy *= 0.92; p.vy += p.gravity;
    p.rot += p.rotV;
    // Scale pop: 0.5 -> 1.2 by frame 4, settle to 1.0, shrink at end
    if (p.scale < 1.0) p.scale = Math.min(1.2, p.scale + 0.2);
    else if (p.scale > 1.0) p.scale += (1.0 - p.scale) * 0.3;
    // Life decay
    p.life -= 0.028;
    if (p.life <= 0) {
      particles[i] = particles[particles.length - 1]; particles.pop(); continue;
    }
    // Non-linear alpha: bright for 40% of life, then quadratic fade
    const a = p.life > 0.6 ? 1 : (p.life / 0.6) * (p.life / 0.6);
    ctx.fillStyle = p.color;
    // Trails (hero + medium only)
    if (p.trail && p.life < 0.95) {
      ctx.globalAlpha = a * 0.2;
      drawStar4(p.px2, p.py2, p.size * p.scale * 0.35, p.rot - 0.1);
      ctx.globalAlpha = a * 0.45;
      drawStar4(p.px, p.py, p.size * p.scale * 0.6, p.rot - 0.05);
    }
    // Hero bloom (manual, no shadowBlur)
    if (p.hero) {
      ctx.globalAlpha = a * HERO_BLOOM_A;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 2.5, 0, Math.PI * 2); ctx.fill();
    }
    // Main star
    ctx.globalAlpha = a;
    drawStar4(p.x, p.y, p.size * p.scale, p.rot);
    i++;
  }
  ctx.globalAlpha = 1;
}

function drawRings() {
  let i = 0;
  while (i < rings.length) {
    const r = rings[i];
    r.r += r.speed; r.alpha -= 0.025;
    if (r.alpha <= 0 || r.r > r.maxR) {
      rings[i] = rings[rings.length - 1]; rings.pop(); continue;
    }
    const progress = r.r / r.maxR;
    // Filled center glow
    ctx.globalAlpha = r.alpha * RING_GLOW_A;
    ctx.fillStyle = r.color;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.fill();
    // Ring stroke with width taper (thick -> thin)
    ctx.globalAlpha = r.alpha;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = r.baseW * (1 - progress * 0.7);
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
    i++;
  }
  ctx.globalAlpha = 1;
}

function drawBursts() {
  let i = 0;
  while (i < bursts.length) {
    const b = bursts[i];
    b.age++;
    // Expand with easeOutCubic
    const t = Math.min(b.age / 18, 1);
    const ease = 1 - Math.pow(1 - t, 3);
    b.innerR = u * 0.02 * ease;
    b.outerR = b.maxR * ease;
    b.rot += 0.015;
    const a = b.alpha * (1 - t);
    if (a <= 0.001 || t >= 1) {
      bursts[i] = bursts[bursts.length - 1]; bursts.pop(); continue;
    }
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
    ctx.globalAlpha = a; ctx.fillStyle = b.color;
    const rays = 12, step = Math.PI * 2 / rays, hw = step * 0.18;
    for (let j = 0; j < rays; j++) {
      const ra = j * step;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ra - hw) * b.innerR, Math.sin(ra - hw) * b.innerR);
      ctx.lineTo(Math.cos(ra) * b.outerR, Math.sin(ra) * b.outerR);
      ctx.lineTo(Math.cos(ra + hw) * b.innerR, Math.sin(ra + hw) * b.innerR);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore(); _lastFont = '';
    i++;
  }
  ctx.globalAlpha = 1;
}

function drawConfetti() {
  const now = performance.now();
  let i = 0;
  while (i < confetti.length) {
    const c = confetti[i];
    const age = now - c.born;
    if (age < c.delay) { i++; continue; }
    const activeAge = age - c.delay;
    if (activeAge > c.life || c.y > H + 20) {
      confetti[i] = confetti[confetti.length - 1]; confetti.pop(); continue;
    }
    c.x += c.vx; c.vy += 0.05; c.y += c.vy;
    c.vx *= 0.99; c.rotation += c.rotSpeed;
    c.alpha = activeAge > c.life * 0.7 ? 1 - (activeAge - c.life * 0.7) / (c.life * 0.3) : 1;

    ctx.globalAlpha = c.alpha;
    ctx.fillStyle = c.color;
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rotation);
    if (c.shape === 'rect') {
      ctx.fillRect(-c.size / 2, -c.size / 4, c.size, c.size / 2);
    } else {
      ctx.beginPath(); ctx.arc(0, 0, c.size / 2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore(); _lastFont = '';
    i++;
  }
  ctx.globalAlpha = 1;
}

function drawFlash() {
  if (flashAlpha <= 0) return;
  ctx.globalAlpha = flashAlpha;
  ctx.fillStyle = flashColor; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
  flashAlpha *= 0.85;
  if (flashAlpha < 0.005) flashAlpha = 0;
}

// ── Main loop ──
let frameDt = 1;
function loop() {
  const now = performance.now();
  frameDt = lastFrameTime ? Math.min((now - lastFrameTime) / 16.667, 3) : 1;
  lastFrameTime = now;
  animFrame++; applyResize();
  if (Math.abs(shakeX) > 0.5) shakeX *= -0.85; else shakeX = 0;
  shakeY = shakeX * 0.5;

  ctx.fillStyle = LETTERBOX; ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  ctx.save(); ctx.translate(VX + shakeX, VY + shakeY);
  if (VX > 0 || VY > 0) { ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip(); }
  ctx.drawImage(bgCache, 0, 0, W, H);
  btnRects.length = 0;

  if (state === 'ready') {
    drawPlaying();
    drawCTA();
  } else if (state === 'playing') {
    const elapsed = performance.now() - roundStartTime;
    // Hint system
    if (hintsGiven < 2) {
      if (hintsGiven === 0 && elapsed >= currentTimeLimit * 0.5) giveHint();
      else if (hintsGiven === 1 && elapsed >= currentTimeLimit * 0.75) giveHint();
    }
    if (elapsed >= currentTimeLimit) handleTimeout();
    drawPlaying();
  } else if (state === 'feedback') {
    if (correctBtnPop > 0) correctBtnPop--;
    if (wrongBtnShake > 0) wrongBtnShake--;
    const fbWait = feedbackResult && feedbackResult.correct ? 700 : 800;
    if (performance.now() - feedbackTimer > fbWait) {
      round++;
      if (lives <= 0 || round >= TOTAL_ROUNDS) endGame();
      else startRound();
    }
    if (state !== 'gameover') drawPlaying();
  } else if (state === 'gameover') drawGameOver();

  drawFloatingTexts(); drawMilestone();
  drawBursts(); drawParticles(); drawRings(); drawConfetti(); drawFlash();
  if (displayScore < score) {
    const diff = score - displayScore;
    displayScore += Math.max(1, Math.ceil(diff * (1 - Math.pow(0.85, frameDt))));
    if (displayScore > score) displayScore = score;
  }
  if (scorePop > 0.005) scorePop *= Math.pow(0.88, frameDt); else scorePop = 0;
  ctx.restore(); _lastFont = ''; requestAnimationFrame(loop);
}

// ── Input ──
let lastInputTime = 0;
function handleInput(e) {
  const now = performance.now();
  if (now - lastInputTime < 50) return;
  lastInputTime = now; e.preventDefault(); SFX.unlock();
  const t = e.touches ? e.touches[0] : e;
  const rect = canvas.getBoundingClientRect();
  const x = t.clientX - rect.left - VX, y = t.clientY - rect.top - VY;
  if (state === 'ready') {
    for (const btn of btnRects)
      if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
        roundStartTime = performance.now();
        gameStartTime = roundStartTime;
        // Strym SDK: game start event
        if (_inStrym()) _strymPost({ type: 'STRYM_GAME_EVENT', event: 'round_start', data: {} });
        state = 'playing';
        ctaAlpha = 0;
        handleAnswer(btn.idx);
        return;
      }
    return;
  }
  if (state === 'playing') {
    for (const btn of btnRects)
      if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) { handleAnswer(btn.idx); return; }
  }
  if (state === 'gameover') {
    for (const btn of btnRects)
      if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
        if (btn.action === 'again') startGame(); else if (btn.action === 'share') shareResults(); return;
      }
  }
}
canvas.addEventListener('touchstart', handleInput, { passive: false });
canvas.addEventListener('mousedown', handleInput);
startGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
