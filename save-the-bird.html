// ===== GAME CONTROLLER =====
const G = {
  init() {
    SFX.init();
    document.addEventListener('touchstart', () => SFX.unlock());
    document.addEventListener('click', () => SFX.unlock());

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && SFX.ctx) SFX.ctx.suspend();
      else if (SFX.ctx) SFX.ctx.resume();
    });

    // Tile selection on pointer release (prevents accidental cancellation from finger drift)
    cage.addEventListener('pointerup', () => {
      if (S._pressedTile) {
        const { row, col } = S._pressedTile;
        S._pressedTile = null;
        tapTile(row, col);
      }
    });
    document.addEventListener('pointerup', () => { S._pressedTile = null; });
    // Treat pointercancel as a tap (browser may cancel on slight finger movement)
    cage.addEventListener('pointercancel', () => {
      if (S._pressedTile) {
        const { row, col } = S._pressedTile;
        S._pressedTile = null;
        tapTile(row, col);
      }
    });

    // Prevent double-tap zoom on mobile
    let _lastTap = 0;
    $('game').addEventListener('touchend', e => {
      const now = Date.now();
      if (now - _lastTap < 300) e.preventDefault();
      _lastTap = now;
    }, { passive: false });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) S.lastTs = 0;
    });

    window.addEventListener('resize', () => {
      measure();
      if (S.phase === 'playing') {
        initSpikes();
        positionStack();
      }
    });

    S.remainingMods = [...MODIFIERS];
    S.round = 0;
    S.modifiers = [];
    S.closestCall = Infinity;
    S.birdScale = 1;
    S.ceilOffset = 0;
    S.extraTypes = 0;
    S.speedMul = 1;
    S.tileScale = 1;
    S.tinyTiles = false;
    S.frozenTiles = false;
    S.ctaDismissed = false;
    S.nextTileId = 0;

    measure();
    startRound();
    requestAnimationFrame(gameLoop);
  },

  async wheelContinue() {
    if (!S._wheelDone) return;
    S._wheelDone = false; // prevent re-entry during fade
    // Fade to black
    const trans = $('roundTransition');
    trans.classList.remove('fade-out');
    trans.classList.add('fade-in');
    await sleep(400);
    // Hide wheel while blacked out
    $('wheelOverlay').classList.remove('active');
    S.round++;
    startRound();
    await sleep(100);
    // Fade back in
    trans.classList.remove('fade-in');
    trans.classList.add('fade-out');
    await sleep(400);
    trans.classList.remove('fade-out');
    // Show round splash on top
    await showRoundSplash(S.round + 1);
  },

  wheelRestart() {
    if (!S._wheelDone) return;
    S._wheelDone = false; // prevent re-entry
    $('wheelOverlay').classList.remove('active');
    // Undo the modifier that was just applied
    const result = S._wheelResult;
    if (result) {
      S.modifiers.pop();
      // Modifier effects are cumulative on state, so full restart is cleaner
    }
    this.restart();
  },

  restart() {
    // Cancel any pending overlay timers
    if (S._loseTimer) { clearTimeout(S._loseTimer); S._loseTimer = null; }
    if (S._winTimer) { clearTimeout(S._winTimer); S._winTimer = null; }
    S._pressedTile = null;

    $('winOverlay').classList.remove('active');
    $('loseOverlay').classList.remove('active');
    $('wheelOverlay').classList.remove('active');

    // Reset danger overlay (only reset on win path before, not loss)
    const dOv = $('dangerOverlay');
    dOv.style.opacity = 0;
    dOv.classList.remove('pulse');

    S.round = 0;
    S.modifiers = [];
    S.remainingMods = [...MODIFIERS];
    S.closestCall = Infinity;
    S.birdScale = 1;
    S.ceilOffset = 0;
    S.extraTypes = 0;
    S.speedMul = 1;
    S.tileScale = 1;
    S.tinyTiles = false;
    S.frozenTiles = false;
    S.ctaDismissed = false;
    S.nextTileId = 0;
    S.lastTs = 0;

    // Reset ceiling spike position and top press
    $('ceilingSpikes').style.top = '0';
    $('topPress').style.height = '0';

    $('modBadges').innerHTML = '';

    measure();
    startRound();
  },
};

// ===== DEBUG =====
function debugApplyMod(idx) {
  if (S.phase !== 'playing') return;
  const mod = MODIFIERS[idx];
  if (!mod) return;
  mod.apply(S);
  S.modifiers.push(mod);
  renderModBadges();
  // Mods that change tile grid need re-init
  if (mod.name === 'Tiny Tiles' || mod.name === 'More Fruits' || mod.name === 'Ice Tiles') {
    measure();
    initGrid();
    renderTiles();
    S.visiblePx = S.cellSize * 1.5 + VGAP + S.spikeH + PLANK_H;
    positionStack();
  }
  // Smaller Cage moves ceiling spikes down (scaled to screen)
  if (mod.name === 'Lower Ceiling') {
    const scaledOff = Math.round(S.ceilOffset * S.cageH / 700);
    $('ceilingSpikes').style.top = scaledOff + 'px';
    $('topPress').style.height = scaledOff + 'px';
  }
}

function debugWinRound() {
  if (S.phase !== 'playing') return;
  S._debugWin = true;
  S.grid = S.grid.map(r => r.map(() => null));
  tileContainer.innerHTML = '';
  tileElMap.clear();
  S.totalRows = 0;
  tileContainer.style.height = '0px';
  roundComplete();
}

// ===== BOOTSTRAP =====
window.addEventListener('load', () => G.init());
</script>
