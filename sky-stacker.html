<!--
  Game: Sky Stacker
  Mechanic: Tap to drop sliding blocks precisely — overhang sliced off, game ends on first miss
  Target time: 30-60 seconds
  Scoring: 80% tower height (blocks placed / 25) + 20% accuracy bonus. Miss = game over.
-->
<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sky Stacker</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}canvas{display:block;position:absolute;top:0;left:0}</style>
</head><body>
<canvas id="c"></canvas>
<script>
const FONT='-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const WHITE='#f0f0f5',GOLD='#ffd93d',GREEN='#2ed573',ORANGE='#ffa502',RED='#ff6b6b',ACCENT='#4d96ff',CYAN='#00cec9';
const PALETTE=['#ff6b6b','#ffa502','#ffd93d','#2ed573','#1e90ff','#a55eea','#fd79a8','#00cec9','#ff922b','#6c5ce7','#e17055','#00b894','#f06595','#74b9ff','#fdcb6e','#a29bfe','#55efc4','#fab1a0','#81ecec','#d2b4de','#e94560','#7bed9f','#70a1ff','#cc5de8','#20c997'];
const MAX_BLOCKS=30;
const PI=Math.PI;

// ── Virtual Viewport ──
let W,H,dpr,VW,VH,VX,VY,lastRW=0,lastRH=0;
const MAX_ASPECT=9/16;
let cachedBgGrads={};
function resize(){
  const rw=window.innerWidth,rh=window.innerHeight;
  if(rw===lastRW&&rh===lastRH)return;lastRW=rw;lastRH=rh;
  dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(rw*dpr);canvas.height=Math.round(rh*dpr);
  canvas.style.width=rw+'px';canvas.style.height=rh+'px';
  if(rw/rh>MAX_ASPECT){VW=Math.round(rh*MAX_ASPECT);VH=rh;VX=Math.round((rw-VW)/2);VY=0;}
  else{VW=rw;VH=rh;VX=0;VY=0;}
  W=VW;H=VH;ctx.setTransform(dpr,0,0,dpr,0,0);cachedBgGrads={};
}

// ── Draw helpers ──
function fillText(text,x,y,size,color,align,weight){
  ctx.font=(weight||'600')+' '+Math.round(size)+'px '+FONT;
  ctx.fillStyle=color||WHITE;ctx.textAlign=align||'center';ctx.textBaseline='middle';
  ctx.fillText(text,Math.round(x),Math.round(y));
}
function roundRect(x,y,w,h,r){
  x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);r=Math.round(Math.min(r,w/2,h/2));
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function easeOutCubic(t){return 1-Math.pow(1-t,3);}
function lerpColor(a,b,t){
  const ar=parseInt(a.slice(1,3),16),ag=parseInt(a.slice(3,5),16),ab=parseInt(a.slice(5,7),16);
  const br=parseInt(b.slice(1,3),16),bg=parseInt(b.slice(3,5),16),bb=parseInt(b.slice(5,7),16);
  const r=Math.round(ar+(br-ar)*t),g=Math.round(ag+(bg-ag)*t),bl=Math.round(ab+(bb-ab)*t);
  return '#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
}

// ── Evolving background: dark city → twilight → sunrise → bright sky ──
// Keyed by progress (0-1). Gradient regenerated only when stage changes.
const BG_STAGES=[
  {at:0,   top:'#0a0a1a',mid:'#1a1a3e',bot:'#0f0c29'},   // dark night
  {at:0.25,top:'#0f1b3d',mid:'#2a2560',bot:'#1a1040'},   // deep twilight
  {at:0.5, top:'#1a2a5e',mid:'#4a3080',bot:'#2a1848'},   // twilight purple
  {at:0.7, top:'#2a3a7e',mid:'#7a4090',bot:'#4a2060'},   // pre-dawn
  {at:0.85,top:'#3a5090',mid:'#c06048',bot:'#802840'},   // sunrise warm
  {at:1.0, top:'#4a70b0',mid:'#f0a050',bot:'#d06030'},   // bright sky
];
let bgStageIdx=-1;
function getBgGrad(progress){
  // Find which two stages we're between
  let lo=BG_STAGES[0],hi=BG_STAGES[1];
  for(let i=1;i<BG_STAGES.length;i++){
    if(progress<=BG_STAGES[i].at){lo=BG_STAGES[i-1];hi=BG_STAGES[i];break;}
    if(i===BG_STAGES.length-1){lo=BG_STAGES[i-1];hi=BG_STAGES[i];}
  }
  const t=lo.at===hi.at?1:Math.max(0,Math.min(1,(progress-lo.at)/(hi.at-lo.at)));
  const key=Math.round(t*20)+'_'+BG_STAGES.indexOf(lo);
  if(cachedBgGrads[key])return cachedBgGrads[key];
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,lerpColor(lo.top,hi.top,t));
  g.addColorStop(0.5,lerpColor(lo.mid,hi.mid,t));
  g.addColorStop(1,lerpColor(lo.bot,hi.bot,t));
  cachedBgGrads[key]=g;return g;
}

let zzfxV=.25,zzfxX;
function zzfxG(p=1,k=.05,b=220,e=0,r=0,t=.1,q=0,D=1,u=0,y=0,v=0,z=0,l=0,E=0,A=0,F=0,c=0,w=1,m=0,B=0,N=0){
  let M=Math,d=2*M.PI,R=44100,G=u*=500*d/R/R,C=b*=(1-k+2*k*M.random(k=[]))*d/R,
  g=0,HH=0,a=0,n=1,I=0,J=0,f=0,h=N<0?-1:1,x=d*h*N*2/R,L=M.cos(x),Z=M.sin,K=Z(x)/4,O=1+K,
  X=-2*L/O,Y=(1-K)/O,P=(1+h*L)/2/O,Q=-(h+L)/O,S=P,T=0,U=0,V=0,WW=0;e=R*e+9;m*=R;r*=R;t*=
  R;c*=R;y*=500*d/R**3;A*=d/R;v*=d/R;z*=R;l=R*l|0;p*=zzfxV;for(h=e+m+r+t+c|0;a<h;k[a++]
  =f*p)++J%(100*F|0)||(f=q?1<q?2<q?3<q?4<q?(g/d%1<D/2)*2-1:Z(g**3):M.max(M.min(M.tan(g)
  ,1),-1):1-(2*g/d%2+2)%2:1-4*M.abs(M.round(g/d)-g/d):Z(g),f=(l?1-B+B*Z(d*a/l):1)*(4<q?
  f:(f<0?-1:1)*M.abs(f)**D)*(a<e?a/e:a<e+m?1-(a-e)/m*(1-w):a<e+m+r?w:a<h-c?(h-a-c)/t*w:
  0),f=c?f/2+(c>a?0:(a<h-c?1:(h-a)/c)*k[a-c|0]/2/p):f,N?f=WW=S*T+Q*(T=U)+P*(U=f)-Y*V-X*(
  V=WW):0),x=(b+=u+=y)*M.cos(A*HH++),g+=x+x*E*Z(a**5),n&&++n>z&&(b+=v,C+=v,n=0),!l||++I%l
  ||(b=C,u=G,n=n||1);return k;
}
function toBuf(samples){if(!zzfxX)return null;const b=zzfxX.createBuffer(1,samples.length,44100);b.getChannelData(0).set(samples);return b;}
function playBuf(buf,rate){if(!zzfxX||!buf)return;const s=zzfxX.createBufferSource();s.buffer=buf;if(rate)s.playbackRate.value=rate;s.connect(zzfxX.destination);s.start();}

let sfx={};
function initAudio(){
  if(!zzfxX){
    try{zzfxX=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
    sfx.perfect =toBuf(zzfxG(...[.7,,1675,,.06,.24,1,1.82,,,837,.06]));
    sfx.great   =toBuf(zzfxG(...[.55,,539,0,.04,.29,1,1.92,,,567,.02,.02,,,,.04]));
    sfx.ok      =toBuf(zzfxG(...[.45,,518,,.07,.19,1,.31,5.14]));
    sfx.slim    =toBuf(zzfxG(...[.35,,420,,.04,.13,1,.45,3.5]));
    sfx.miss    =toBuf(zzfxG(...[.4,,270,.01,.01,.35,0,.6,-11,,,,.08,4.5]));
    sfx.streak5 =toBuf(zzfxG(...[.5,,784,,.08,.22,1,1.5,,,392,.05]));
    sfx.streak10=toBuf(zzfxG(...[.55,,1047,,.08,.25,1,1.5,,,523,.06]));
    sfx.streak15=toBuf(zzfxG(...[.65,,1319,,.1,.3,1,1.6,,,660,.06]));
    sfx.goGood0 =toBuf(zzfxG(...[.45,,523,,.08,.22,1,1.5,,,260,.05]));
    sfx.goGood1 =toBuf(zzfxG(...[.5,,659,,.08,.22,1,1.5,,,330,.05]));
    sfx.goGood2 =toBuf(zzfxG(...[.55,,784,,.08,.25,1,1.5,,,392,.05]));
    sfx.goGood3 =toBuf(zzfxG(...[.65,,1047,,.1,.3,1,1.6,,,523,.06]));
    sfx.goBad0  =toBuf(zzfxG(...[.35,,311,.01,.06,.25,1,.7,-5,,,,.05]));
    sfx.goBad1  =toBuf(zzfxG(...[.3,,262,.01,.06,.28,1,.7,-6,,,,.06]));
    sfx.goBad2  =toBuf(zzfxG(...[.25,,208,.02,.08,.35,1,.6,-8,,,,.08]));
    sfx.countTick=toBuf(zzfxG(...[.12,,900,,.005,.01,1,1.8,,,300,.01]));
    sfx.silent  =toBuf(new Float32Array(441));
  }
  if(zzfxX.state==='suspended'){zzfxX.resume();playBuf(sfx.silent);}
}

// ── Haptics ──
const tgHaptic=window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.HapticFeedback;
function vib(p){
  try{
    if(typeof p==='string'&&tgHaptic){
      if(p==='success'||p==='error'||p==='warning')tgHaptic.notificationOccurred(p);
      else tgHaptic.impactOccurred(p);return;}
    if(tgHaptic){const ms=Array.isArray(p)?p.reduce((a,b)=>a+b,0):p;
      tgHaptic.impactOccurred(ms<=8?'light':ms<=20?'medium':ms<=40?'heavy':'rigid');return;}
    if(navigator.vibrate)navigator.vibrate(p);
  }catch(e){}
}

// ── Callouts ──
let callout='',calloutAlpha=0,calloutColor=GOLD,calloutScale=1,lastCallout='';
function showCallout(text,color){if(text===lastCallout)return;lastCallout=text;callout=text;calloutAlpha=1;calloutColor=color||GOLD;calloutScale=1.3;}
function pick(arr){return arr[Math.random()*arr.length|0];}
function calloutForPlace(tier,stk,placed){
  if(stk===20)return showCallout('⭐ 20 streak! LEGENDARY!',GOLD);
  if(stk===15)return showCallout('🔥🔥🔥 15 in a row!',GOLD);
  if(stk===10)return showCallout('🔥🔥 10 streak!',GOLD);
  if(stk===5)return showCallout('🔥 5 streak!',GOLD);
  if(placed===MAX_BLOCKS)return showCallout(pick(['🏆 Full tower!','⭐ Maxed out!','🎯 Perfect finish!']),GOLD);
  if(placed===MAX_BLOCKS-1)return showCallout(pick(['🏁 Last one!','⚡ One more!']),GREEN);
  if(placed===Math.floor(MAX_BLOCKS/2)&&stk>=3)return showCallout('💪 Halfway, on fire!',GREEN);
  if(placed===25)return showCallout(pick(['🏁 Final stretch!','⚡ Five to go!']),'#74b9ff');
  if(tier==='perfect'&&stk<5)return showCallout(pick(['⚡ Perfect!','💎 Exact!','✨ Precise!','🎯 Bullseye!']),GOLD);
  if(stk>=3&&tier==='perfect')return showCallout(pick(['🔥 Rolling!','⚡ Smooth!']),GREEN);
}

// ── Effects ──
let particles=[],rings=[],floatingTexts=[];
let flashAlpha=0,flashColor=GOLD;
let shakeX=0,shakeY=0;

function spawnParticles(x,y,n,color,speed){
  for(let i=0;i<n;i++){const a=Math.random()*PI*2,v=(0.5+Math.random())*speed;
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,alpha:1,size:2+Math.random()*3,color,gravity:0.08+Math.random()*0.04});}
}
function spawnRing(x,y,color,maxR,w){rings.push({x,y,r:0,maxR:maxR||40,alpha:0.8,color,width:w||3,speed:(maxR||40)/20});}

function updateEffects(){
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.alpha-=0.025;if(p.alpha<=0)particles.splice(i,1);}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=r.speed;r.alpha-=0.04;if(r.alpha<=0)rings.splice(i,1);}
  for(let i=floatingTexts.length-1;i>=0;i--){const ft=floatingTexts[i];ft.y+=ft.vy;ft.alpha-=0.018;if(ft.scale&&ft.scale>1)ft.scale+=(1-ft.scale)*0.1;if(ft.alpha<=0)floatingTexts.splice(i,1);}
  if(flashAlpha>0)flashAlpha*=0.85;if(flashAlpha<0.01)flashAlpha=0;
  shakeX*=0.85;shakeY*=0.85;if(Math.abs(shakeX)<0.5)shakeX=0;if(Math.abs(shakeY)<0.5)shakeY=0;
}
function drawEffects(){
  for(const p of particles){ctx.globalAlpha=p.alpha;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(Math.round(p.x),Math.round(p.y),Math.round(p.size),0,PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  for(const r of rings){ctx.strokeStyle=r.color;ctx.lineWidth=Math.round(r.width);ctx.globalAlpha=r.alpha;ctx.beginPath();ctx.arc(Math.round(r.x),Math.round(r.y),Math.round(r.r),0,PI*2);ctx.stroke();}
  ctx.globalAlpha=1;
  for(const ft of floatingTexts){ctx.globalAlpha=Math.min(ft.alpha*2,1);const s=ft.scale||1;fillText(ft.text,ft.x,ft.y,Math.min(W,H)*ft.size*s,ft.color,'center','800');}
  ctx.globalAlpha=1;
}

// ── Game State ──
let state='ready'; // ready → playing → missFrozen → gameover
let blocks=[],moving=null,moveDir=1,spawnSide=1,moveSpeed=0;
let blockIndex=0,resultLog=[];
let streak=0,bestStreak=0,perfectCount=0;
let comboScale=1,ctaPulse=0;
let startTime=0,elapsed=0;
let sliceAnim=null,camY=0,targetCamY=0;
let goData=null,goDispatched=false,goStartTime=0;
let btnRect={x:0,y:0,w:0,h:0},shareBtnRect={x:0,y:0,w:0,h:0};
let copiedFlash=0,lastTime=0;
const GO_COUNT_DUR=1800;

// Running score
let runScore=0,displayScore=0,scoreBounce=1,totalStreakBonus=0;
const BASE_PTS=5,STREAK_PT=3; // each golden block in streak pays ×3 per level

// Tower wobble (sinusoidal, decays)
let wobbleAmp=0,wobblePhase=0;
// Harvest animation: golden blocks pulsing when paying out
let harvestFlash=0; // timestamp of last harvest
// Danger state: narrows vignette when block gets slim
let dangerLevel=0; // 0-1
// Miss freeze
let missBlock=null,missFreezeStart=0;
const MISS_FREEZE_DUR=450;

const START_W_RATIO=0.65,PERFECT_THRESHOLD=0.025,BASE_SPEED_RATIO=0.004;
const MIN_BLOCK_W=12; // below this → guaranteed miss next round

function blockH(){return Math.round(Math.max(H*0.05,30));}
function blockY(index){return H-Math.round(Math.min(W,H)*0.14)-index*blockH();}

function initGame(){
  const bw=W*START_W_RATIO;
  blocks=[{x:W/2-bw/2,w:bw,h:blockH(),color:PALETTE[0],isPerfect:false}];
  moving=null;moveDir=1;spawnSide=1;blockIndex=1;
  resultLog=[];streak=0;bestStreak=0;perfectCount=0;
  comboScale=1;flashAlpha=0;shakeX=0;shakeY=0;
  sliceAnim=null;camY=0;targetCamY=0;
  goData=null;goDispatched=false;
  particles=[];rings=[];floatingTexts=[];copiedFlash=0;
  callout='';calloutAlpha=0;lastCallout='';
  wobbleAmp=0;wobblePhase=0;dangerLevel=0;
  missBlock=null;missFreezeStart=0;
  runScore=0;displayScore=0;scoreBounce=1;totalStreakBonus=0;harvestFlash=0;
  cachedBgGrads={};
  spawnMoving();
  state='ready';ctaPulse=0;
}

function spawnMoving(){
  if(blockIndex>MAX_BLOCKS){endGame();return;}
  const u=Math.min(W,H),prev=blocks[blocks.length-1],bh=blockH();
  const y=blockY(blockIndex);
  const fromLeft=spawnSide>0;spawnSide*=-1;
  moveDir=fromLeft?1:-1;
  moveSpeed=u*BASE_SPEED_RATIO*(1+blockIndex*0.14+blockIndex*blockIndex*0.003);
  moving={x:fromLeft?-prev.w:W,w:prev.w,h:bh,y:y,color:PALETTE[blockIndex%PALETTE.length]};
  // Update danger level based on block width relative to original
  const origW=W*START_W_RATIO;
  // Danger: any width loss triggers it, squared curve ramps fast
  const widthRatio=moving.w/origW; // 1.0 = full, 0 = gone
  dangerLevel=widthRatio>=0.98?0:Math.pow(1-widthRatio,0.6); // kicks in immediately, ramps hard
}

function placeBlock(){
  if(!moving)return;
  const u=Math.min(W,H),prev=blocks[blocks.length-1];
  let overlapLeft=Math.max(prev.x,moving.x);
  const overlapRight=Math.min(prev.x+prev.w,moving.x+moving.w);
  let overlapW=overlapRight-overlapLeft;

  if(overlapW<=0){
    // ── MISS: dramatic slow-mo freeze before fall ──
    playBuf(sfx.miss);vib('error');
    resultLog.push('miss');
    missBlock={...moving};
    missFreezeStart=performance.now();
    moving=null;
    state='missFrozen';
    return;
  }

  // Clamp to minimum visible width
  if(overlapW<MIN_BLOCK_W){overlapW=MIN_BLOCK_W;overlapLeft=prev.x+prev.w/2-MIN_BLOCK_W/2;}

  const accuracy=overlapW/moving.w;
  const isPerfect=Math.abs(overlapW-moving.w)<u*PERFECT_THRESHOLD;
  const sy=moving.y+camY;
  const floatY=sy-blockH()*1.5;

  let placedW,placedX,tier;

  if(isPerfect){
    placedW=prev.w;placedX=prev.x;tier='perfect';
    perfectCount++;streak++;if(streak>bestStreak)bestStreak=streak;
    comboScale=1.4;flashColor=GOLD;flashAlpha=0.12+Math.min(streak*0.01,0.08);

    // Rising pitch: each consecutive perfect goes higher, resets on break
    const pitchRate=Math.min(1.5,1+Math.min(streak-1,10)*0.05); // 1.0 → 1.05 → ... → 1.5 cap
    playBuf(sfx.perfect,pitchRate);vib('success');

    spawnRing(W/2,sy,GOLD,50);
    spawnParticles(W/2,sy,15+Math.min(streak*4,40),GOLD,3);
    if(streak>=2){spawnRing(W/2,sy,'#ff922b',35);spawnParticles(W/2,sy,8,WHITE,2);}
    const label=streak>=2?'PERFECT ×'+streak:'PERFECT!';
    floatingTexts.push({text:label,color:GOLD,x:W/2,y:floatY,alpha:1,vy:-3.5,size:0.055,scale:1.4});
    wobbleAmp=0;

    // ── Score: base + streak harvest (each golden block in streak pays) ──
    runScore+=BASE_PTS;
    const harvestPay=streak*STREAK_PT; // streak=1→3, streak=5→15, etc.
    runScore+=harvestPay;
    totalStreakBonus+=harvestPay;
    scoreBounce=1.5;
    harvestFlash=performance.now();

    // Visual cascade: each golden block in current streak chain emits "+N"
    const newBlockIdx=blocks.length; // block about to be pushed
    for(let si=0;si<streak;si++){
      const bi=newBlockIdx-si; // current → older streak blocks
      const bx=bi===newBlockIdx?placedX+placedW/2:(blocks[bi]?blocks[bi].x+blocks[bi].w/2:W/2);
      const byy=blockY(bi===newBlockIdx?newBlockIdx:bi)+camY;
      const delay=si*60;
      ((d,x,y)=>{
        setTimeout(()=>{
          floatingTexts.push({text:'+'+STREAK_PT,color:GOLD,x,y:y-blockH()*0.3,alpha:1,vy:-2.5,size:0.032,scale:1.2});
        },d);
      })(delay,bx,byy);
    }
    // Show total harvest as bigger float
    if(streak>=2){
      setTimeout(()=>{
        floatingTexts.push({text:'+'+harvestPay+' streak!',color:GOLD,x:W/2,y:floatY-blockH()*1.2,alpha:1,vy:-2,size:0.04,scale:1.3});
      },streak*60+80);
    }
  } else if(accuracy>0.85){
    placedW=overlapW;placedX=overlapLeft;tier='great';
    streak=0;comboScale=1;flashColor=GREEN;flashAlpha=0.1;
    playBuf(sfx.great);vib('medium');
    spawnParticles(W/2,sy,12,GREEN,2.5);
    floatingTexts.push({text:'Great!',color:GREEN,x:W/2,y:floatY,alpha:1,vy:-3.5,size:0.045,scale:1.3});
    wobbleAmp=Math.min(wobbleAmp+1,3);
    runScore+=BASE_PTS;scoreBounce=1.25;
    floatingTexts.push({text:'+'+BASE_PTS,color:GREEN,x:W/2,y:floatY-blockH()*0.6,alpha:0.7,vy:-2,size:0.028,scale:1.1});
  } else if(accuracy>0.55){
    placedW=overlapW;placedX=overlapLeft;tier='ok';
    streak=0;comboScale=1;flashColor=moving.color;flashAlpha=0.06;
    playBuf(sfx.ok);vib('light');
    spawnParticles(W/2,sy,6,moving.color,2);
    floatingTexts.push({text:'OK',color:ORANGE,x:W/2,y:floatY,alpha:1,vy:-3.5,size:0.04,scale:1.2});
    wobbleAmp=Math.min(wobbleAmp+3,8);
    runScore+=3;scoreBounce=1.15;
    floatingTexts.push({text:'+3',color:ORANGE,x:W/2,y:floatY-blockH()*0.6,alpha:0.6,vy:-2,size:0.026,scale:1.0});
  } else {
    placedW=overlapW;placedX=overlapLeft;tier='slim';
    streak=0;comboScale=1;shakeX=4;shakeY=4;
    flashColor=RED;flashAlpha=0.1;
    playBuf(sfx.slim);vib('warning');
    floatingTexts.push({text:'Slim...',color:RED,x:W/2,y:floatY,alpha:1,vy:-3.5,size:0.04,scale:1.1});
    wobbleAmp=Math.min(wobbleAmp+6,12);
    runScore+=1;scoreBounce=1.05;
  }

  resultLog.push(tier);
  blocks.push({x:placedX,w:placedW,h:moving.h,color:moving.color,isPerfect:tier==='perfect'});

  // Slice animation
  if(!isPerfect){
    const mLeft=moving.x,mRight=moving.x+moving.w;
    const slicedLeft=mLeft<prev.x?{x:mLeft,w:prev.x-mLeft}:null;
    const slicedRight=mRight>prev.x+prev.w?{x:prev.x+prev.w,w:mRight-(prev.x+prev.w)}:null;
    const sliced=slicedLeft||slicedRight;
    if(sliced&&sliced.w>2){
      sliceAnim={block:{x:sliced.x,w:sliced.w,h:moving.h,y:moving.y,color:moving.color},vy:0,alpha:1};
      setTimeout(()=>{sliceAnim=null;},600);
    }
  }

  moving=null;blockIndex++;
  const placed=blocks.length-1;

  // Streak milestone sounds
  if(streak===5){setTimeout(()=>playBuf(sfx.streak5),80);vib([15,30,20]);}
  else if(streak===10){setTimeout(()=>playBuf(sfx.streak10),80);vib([15,30,15,30,20]);}
  else if(streak>=15&&streak%5===0){setTimeout(()=>playBuf(sfx.streak15),80);vib([15,30,15,30,15,30,20]);}

  calloutForPlace(tier,streak,placed);

  if(blockIndex>MAX_BLOCKS)endGame();
  else spawnMoving();
}

function getCameraY(){
  if(blocks.length<=1)return 0;
  const topY=blockY(blocks.length-1),target=H*0.4;
  return topY<target?target-topY:0;
}

// ── Scoring + Titles ──
const TITLE_LADDER=[
  {min:0,   title:'🧱 Rubble',color:RED},
  {min:30,  title:'🏗️ Shaky Start',color:'#e08050'},
  {min:70,  title:'🧱 Stacking Up',color:ORANGE},
  {min:130, title:'🏠 Solid Build',color:'#8bb8d0'},
  {min:200, title:'🏢 Tower Rising',color:CYAN},
  {min:280, title:'🏙️ Skyline Builder',color:GREEN},
  {min:380, title:'🗼 Sky High!',color:'#a0e86c'},
  {min:550, title:'🌟 Master Architect',color:GOLD},
];
function getTitleForScore(s){let t=TITLE_LADDER[0];for(let i=TITLE_LADDER.length-1;i>=0;i--)if(s>=TITLE_LADDER[i].min){t=TITLE_LADDER[i];break;}return t;}
function getPercentile(s){
  const mean=170,sd=100;
  const z=(s-mean)/(sd*Math.SQRT2);
  const t=1/(1+0.3275911*Math.abs(z));
  const poly=t*(0.254829592+t*(-0.284496736+t*(1.421413741+t*(-1.453152027+t*1.061405429))));
  const erf=1-poly*Math.exp(-z*z);const cdf=0.5*(1+(z>=0?erf:-erf));
  return Math.max(1,Math.min(99,Math.round(cdf*100)));
}
function endGame(){
  state='gameover';goStartTime=performance.now();
  elapsed=((performance.now()-startTime)/1000).toFixed(1);
  const placed=blocks.length-1;
  goData={score:runScore,placed,elapsed:parseFloat(elapsed),perfectCount,bestStreak};

  const good=runScore>=250;
  const tickCount=12;
  for(let i=0;i<tickCount;i++)setTimeout(()=>playBuf(sfx.countTick),(i/tickCount)*GO_COUNT_DUR);
  const keys=good?['goGood0','goGood1','goGood2','goGood3']:['goBad0','goBad1','goBad2'];
  keys.forEach((k,i)=>setTimeout(()=>playBuf(sfx[k]),GO_COUNT_DUR+i*160));
  vib('heavy');

  if(!goDispatched){goDispatched=true;
    window.dispatchEvent(new CustomEvent('gameComplete',{
      detail:{score:runScore,maxScore:1545,duration:parseFloat(elapsed),won:placed>=MAX_BLOCKS}
    }));
  }
}

// ── Share ──
function doShare(now){
  if(!goData)return;vib('light');
  const d=goData,info=getTitleForScore(d.score);
  const dots=resultLog.map(r=>r==='perfect'?'🟡':r==='great'?'🟢':r==='ok'?'🟠':r==='slim'?'🔴':'❌').join('');
  const pctl=getPercentile(d.score);
  const text='🏗️ Sky Stacker\n\n'+info.title+' — '+d.score+'\nTop '+(100-pctl)+'% of players\n\n'+d.placed+'/'+MAX_BLOCKS+' blocks · '+d.bestStreak+'🔥 best streak\n\n'+dots;
  if(navigator.share){navigator.share({text}).then(()=>{copiedFlash=now;}).catch(()=>{});return;}
  try{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:0;top:0;opacity:0.01;width:1px;height:1px';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);const ok=document.execCommand('copy');document.body.removeChild(ta);if(ok){copiedFlash=now;return;}}catch(e){}
  try{navigator.clipboard.writeText(text).then(()=>{copiedFlash=now;}).catch(()=>{});}catch(e){}
}

// ── Input ──
let lastInputTime=0;
function handleInput(e){
  const now=performance.now();
  if(now-lastInputTime<50)return;lastInputTime=now;e.preventDefault();
  initAudio();
  if(state==='ready'&&moving){startTime=now;state='playing';placeBlock();return;}
  if(state==='playing'&&moving){placeBlock();return;}
  if(state==='gameover'){
    if(now-goStartTime<GO_COUNT_DUR+300)return;
    const t=e.touches?e.touches[0]:e;
    const rect=canvas.getBoundingClientRect();
    const ix=t.clientX-rect.left-VX,iy=t.clientY-rect.top-VY;
    if(ix>=btnRect.x&&ix<=btnRect.x+btnRect.w&&iy>=btnRect.y&&iy<=btnRect.y+btnRect.h){initGame();return;}
    if(ix>=shareBtnRect.x&&ix<=shareBtnRect.x+shareBtnRect.w&&iy>=shareBtnRect.y&&iy<=shareBtnRect.y+shareBtnRect.h){doShare(now);copiedFlash=now;return;}
  }
}
canvas.addEventListener('touchstart',handleInput,{passive:false});
canvas.addEventListener('mousedown',handleInput);

// ── Dot drawing ──
function drawDot(x,y,r,tier){
  if(tier==='perfect'){
    ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.rotate(PI/4);
    ctx.fillStyle=GOLD;const dd=Math.round(r*0.85);ctx.fillRect(-dd,-dd,dd*2,dd*2);ctx.restore();
  } else {
    const colors={great:GREEN,ok:ORANGE,slim:RED,miss:'#e94560'};
    ctx.fillStyle=colors[tier]||'rgba(255,255,255,0.15)';
    ctx.beginPath();ctx.arc(Math.round(x),Math.round(y),Math.round(r),0,PI*2);ctx.fill();
  }
}

// ──────────────────────────────────────
// ── DRAW ──
// ──────────────────────────────────────

function drawCTA(now){
  ctaPulse+=0.04;
  const pulse=0.5+Math.sin(ctaPulse)*0.5;
  const ctaFS=Math.min(W*0.08,36);
  const subFS=Math.min(W*0.042,20);
  const ctaY=H*0.22;
  ctx.globalAlpha=0.55+pulse*0.45;
  fillText('⬇️ TAP TO DROP',W/2,ctaY,ctaFS,WHITE,'center','800');
  ctx.globalAlpha=0.4;
  fillText('Stack precisely · One miss = game over',W/2,ctaY+Math.min(H*0.05,36),subFS,'rgba(240,240,245,0.7)','center','500');
  ctx.globalAlpha=1;
}

function drawStack(now){
  const wobbleOff=wobbleAmp*Math.sin(wobblePhase);
  ctx.save();ctx.translate(wobbleOff,camY);

  for(let i=0;i<blocks.length;i++){
    const b=blocks[i],by=blockY(i);
    ctx.fillStyle=b.color;roundRect(b.x,by,b.w,b.h-1,3);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.12)';roundRect(b.x,by,b.w,b.h*0.4,3);ctx.fill();

    if(b.isPerfect){
      // All perfects get a permanent golden tint
      const inActiveStreak=streak>=1&&i>=blocks.length-streak;
      const harvestAge=now-harvestFlash;
      const harvestPulse=inActiveStreak&&harvestAge<400?0.4*(1-harvestAge/400):0;

      if(inActiveStreak){
        // Active streak: brighter pulsing gold + outline
        const glowPulse=0.30+0.20*Math.sin(now/180+i*0.7)+harvestPulse;
        ctx.fillStyle='rgba(255,217,61,'+glowPulse+')';roundRect(b.x,by,b.w,b.h-1,3);ctx.fill();
        ctx.strokeStyle=GOLD;ctx.lineWidth=2;roundRect(b.x,by,b.w,b.h-1,3);ctx.stroke();
      } else {
        // Past perfects: subtle permanent gold tint + thin outline
        ctx.fillStyle='rgba(255,217,61,0.15)';roundRect(b.x,by,b.w,b.h-1,3);ctx.fill();
        ctx.strokeStyle='rgba(255,217,61,0.3)';ctx.lineWidth=2;roundRect(b.x,by,b.w,b.h-1,3);ctx.stroke();
      }
    }
  }

  // Moving block with combo pulse
  if(moving){
    const scaleW=moving.w*comboScale,scaleX=moving.x-(scaleW-moving.w)/2;
    // Danger pulse: block pulses red when slim
    if(dangerLevel>0.1){
      const dp=0.5+0.5*Math.sin(now/120);
      ctx.shadowColor=RED;ctx.shadowBlur=Math.round(dangerLevel*15*dp);
    }
    ctx.fillStyle=moving.color;roundRect(scaleX,moving.y,scaleW,moving.h-1,3);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.18)';roundRect(scaleX,moving.y,scaleW,moving.h*0.4,3);ctx.fill();
    ctx.shadowColor='transparent';ctx.shadowBlur=0;
    // Guide lines
    if(blocks.length>0){
      const prev=blocks[blocks.length-1];
      ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=2;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.moveTo(Math.round(prev.x),moving.y);ctx.lineTo(Math.round(prev.x),moving.y+moving.h);
      ctx.moveTo(Math.round(prev.x+prev.w),moving.y);ctx.lineTo(Math.round(prev.x+prev.w),moving.y+moving.h);
      ctx.stroke();ctx.setLineDash([]);
    }
  }

  // Frozen miss block (during slow-mo)
  if(state==='missFrozen'&&missBlock){
    const mElapsed=performance.now()-missFreezeStart;
    const freezeT=Math.min(1,mElapsed/MISS_FREEZE_DUR);
    // Pulse red, growing glow
    const dp=0.5+0.5*Math.sin(mElapsed/60);
    ctx.shadowColor=RED;ctx.shadowBlur=Math.round(20*freezeT*dp);
    ctx.globalAlpha=1;
    ctx.fillStyle=missBlock.color;roundRect(missBlock.x,missBlock.y,missBlock.w,missBlock.h-1,3);ctx.fill();
    ctx.shadowColor='transparent';ctx.shadowBlur=0;
  }

  // Falling slice
  if(sliceAnim){
    ctx.globalAlpha=Math.max(0,sliceAnim.alpha);ctx.fillStyle=sliceAnim.block.color;
    roundRect(sliceAnim.block.x,sliceAnim.block.y,sliceAnim.block.w,sliceAnim.block.h-1,3);ctx.fill();ctx.globalAlpha=1;
  }

  ctx.restore();
}

// ── Danger vignette ──
function drawDangerVignette(){
  if(dangerLevel<0.05)return;
  const intensity=dangerLevel*0.7;
  // Tighter radius = more claustrophobic
  const inner=W*(0.35-dangerLevel*0.15);
  const outer=W*(0.75+dangerLevel*0.15);
  const g=ctx.createRadialGradient(W/2,H/2,inner,W/2,H/2,outer);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(0.6,'rgba(120,10,10,'+intensity*0.4+')');
  g.addColorStop(1,'rgba(180,15,15,'+intensity+')');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

function drawHUD(now){
  const u=Math.min(W,H),pad=u*0.035,placed=blocks.length-1;
  const counterFS=Math.min(W*0.05,22);
  const dotR=Math.max(4,u*0.012);
  const dotGap=Math.min(u*0.028,(W*0.85)/MAX_BLOCKS);

  fillText(placed+'/'+MAX_BLOCKS,W/2,pad+counterFS/2,counterFS,'rgba(240,240,245,0.7)','center','600');

  const dotsY=pad+counterFS+u*0.035;
  const dotsStartX=W/2-(MAX_BLOCKS*dotGap)/2;
  for(let i=0;i<MAX_BLOCKS;i++){
    const dx=dotsStartX+i*dotGap+dotGap/2;
    if(i<resultLog.length)drawDot(dx,dotsY,dotR,resultLog[i]);
    else if(i===resultLog.length){ctx.fillStyle='rgba(255,255,255,'+(0.3+0.3*Math.sin(now/200))+')';ctx.beginPath();ctx.arc(Math.round(dx),Math.round(dotsY),Math.round(dotR),0,PI*2);ctx.fill();}
    else{ctx.fillStyle='rgba(255,255,255,0.15)';ctx.beginPath();ctx.arc(Math.round(dx),Math.round(dotsY),Math.round(dotR),0,PI*2);ctx.fill();}
  }

  // ── Bottom HUD: score + streak with text shadow for readability ──
  displayScore+=(runScore-displayScore)*0.15;if(Math.abs(displayScore-runScore)<1)displayScore=runScore;
  scoreBounce+=(1-scoreBounce)*0.1;
  const scoreFS=Math.min(W*0.08,36);
  const streakFS=Math.min(W*0.045,22);
  const scoreY=H-pad*1.2;
  const scoreStr=Math.round(displayScore).toString();

  // Shadow helper — all bottom HUD text gets dark halo
  ctx.shadowColor='rgba(0,0,0,0.8)';ctx.shadowBlur=8;ctx.shadowOffsetX=0;ctx.shadowOffsetY=2;

  // Score
  ctx.font='900 '+Math.round(scoreFS)+'px '+FONT;
  ctx.save();ctx.translate(pad,scoreY);ctx.scale(scoreBounce,scoreBounce);
  fillText(scoreStr,0,0,scoreFS,GOLD,'left','900');
  ctx.restore();

  // Streak counter — above score, aligned to same left edge
  if(streak>=1){
    const streakColor=streak>=15?GOLD:streak>=10?'#ff922b':streak>=5?RED:streak>=3?'#74b9ff':WHITE;
    const streakY=scoreY-scoreFS*0.55-streakFS*0.4;
    ctx.save();ctx.translate(pad,streakY);ctx.scale(comboScale,comboScale);
    fillText(streak+'🔥',0,0,streakFS,streakColor,'left','700');
    ctx.restore();
  }

  // Clear shadow
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;

  if(calloutAlpha>0.01){
    calloutAlpha*=0.97;
    if(calloutScale>1)calloutScale+=(1-calloutScale)*0.12;
    ctx.globalAlpha=Math.min(1,calloutAlpha);
    ctx.save();ctx.translate(W/2,H*0.17);ctx.scale(calloutScale,calloutScale);
    fillText(callout,0,0,Math.min(W*0.046,24),calloutColor,'center','800');
    ctx.restore();ctx.globalAlpha=1;
  }
}

function drawGameOver(now){
  ctx.fillStyle='rgba(15,12,41,0.88)';ctx.fillRect(0,0,W,H);
  const d=goData;if(!d)return;
  const goElapsed=now-goStartTime;
  const countT=Math.min(1,goElapsed/GO_COUNT_DUR),countEased=easeOutCubic(countT);
  const animScore=Math.round(countEased*d.score);
  const animTitle=getTitleForScore(animScore),finalTitle=getTitleForScore(d.score);
  const pctl=getPercentile(d.score);
  function fadeIn(delay){const t=(goElapsed-GO_COUNT_DUR-delay)/300;return t<0?0:Math.min(1,easeOutCubic(t));}

  // Buttons — anchored to bottom
  const btnW=Math.min(W*0.40,200),btnH=Math.max(H*0.06,50);
  const btnY=H-Math.max(H*0.06,30)-btnH,gapBtn=Math.min(W*0.03,14);
  const totalBtnW=btnW*2+gapBtn,btnStartX=(W-totalBtnW)/2;

  // Font sizes
  const titleFS=Math.min(W*0.07,38);
  const scoreFS=Math.min(W*0.24,130);
  const pillFS=Math.min(W*0.04,22);
  const pillH=Math.min(H*0.045,42);
  const statFS=Math.min(W*0.042,22);
  const dotR=Math.max(5,Math.min(W*0.016,8));
  const dotPad=W*0.06;
  const dotCount=Math.max(1,resultLog.length);
  const dotGap=Math.min(20,(W-dotPad*2)/dotCount);

  // Gaps
  const g1=Math.min(H*0.01,8);    // title → score
  const g2=Math.min(H*0.02,16);   // score → pill
  const g3=Math.min(H*0.02,16);   // pill → stats
  const g4=Math.min(H*0.025,20);  // stats → dots

  // Layout height
  const totalH=titleFS+g1+scoreFS+g2+pillH+g3+statFS+g4+dotR*2;
  const topY=Math.max(20,H*0.04);
  const contentH=(btnY-Math.min(H*0.02,16))-topY;
  let y=topY+Math.max(0,(contentH-totalH)/2);

  // 1. Emoji title
  const titleInfo=countT<1?animTitle:finalTitle;
  fillText(titleInfo.title,W/2,y+titleFS/2,titleFS,titleInfo.color,'center','800');
  y+=titleFS+g1;

  // 2. Hero score — dominant
  fillText(animScore.toString(),W/2,y+scoreFS*0.44,scoreFS,WHITE,'center','900');
  y+=scoreFS+g2;

  // 3. Percentile pill
  const pa=fadeIn(0);
  if(pa>0){
    ctx.globalAlpha=pa;
    const pillText='Top '+(100-pctl)+'% of players';
    const pillW=Math.min(W*0.6,260),pillX=W/2-pillW/2;
    ctx.fillStyle='rgba(255,255,255,0.07)';
    roundRect(pillX,y,pillW,pillH,pillH/2);ctx.fill();
    fillText(pillText,W/2,y+pillH/2,pillFS,'rgba(240,240,245,0.55)','center','600');
    ctx.globalAlpha=1;
  }
  y+=pillH+g3;

  // 4. Single stat line
  const sa=fadeIn(150);
  if(sa>0){
    ctx.globalAlpha=sa;
    const statLine=d.placed+'/'+MAX_BLOCKS+' blocks  ·  '+d.bestStreak+'🔥 best streak';
    fillText(statLine,W/2,y+statFS*0.45,statFS,'rgba(240,240,245,0.55)','center','500');
    ctx.globalAlpha=1;
  }
  y+=statFS+g4;

  // 5. Round dots
  const da=fadeIn(350);
  if(da>0){
    ctx.globalAlpha=da;
    const dW=resultLog.length*dotGap,dSX=W/2-dW/2+dotGap/2;
    for(let i=0;i<resultLog.length;i++)drawDot(dSX+i*dotGap,y,dotR,resultLog[i]);
    ctx.globalAlpha=1;
  }

  // 6. Buttons
  const ba=fadeIn(500);
  if(ba>0){
    ctx.globalAlpha=ba;
    btnRect={x:btnStartX,y:btnY,w:btnW,h:btnH};
    ctx.fillStyle=ACCENT;roundRect(btnStartX,btnY,btnW,btnH,Math.round(btnH*0.3));ctx.fill();
    fillText('Play Again',btnStartX+btnW/2,btnY+btnH/2,Math.min(W*0.042,20),WHITE,'center','700');
    const sbX=btnStartX+btnW+gapBtn;
    shareBtnRect={x:sbX,y:btnY,w:btnW,h:btnH};
    ctx.strokeStyle='rgba(240,240,245,0.3)';ctx.lineWidth=2;
    roundRect(sbX,btnY,btnW,btnH,Math.round(btnH*0.3));ctx.stroke();
    const sl=copiedFlash&&now-copiedFlash<1500?(navigator.share?'Shared!':'Copied!'):'Share';
    fillText(sl,sbX+btnW/2,btnY+btnH/2,Math.min(W*0.042,20),WHITE,'center','700');
    ctx.globalAlpha=1;
  }
}

// ── Main Loop ──
function update(ts){
  requestAnimationFrame(update);resize();
  const now=performance.now();
  const dt=Math.min((ts-lastTime)/1000,0.033);lastTime=ts;

  // Miss freeze → falling → game over
  if(state==='missFrozen'){
    const mElapsed=now-missFreezeStart;
    if(mElapsed>=MISS_FREEZE_DUR){
      // Freeze over: now the dramatic shake + fall
      shakeX=12;shakeY=12;flashColor=RED;flashAlpha=0.3;
      const sy=missBlock.y+camY;
      floatingTexts.push({text:'MISS!',color:RED,x:W/2,y:sy-blockH()*1.5,alpha:1,vy:-3.5,size:0.07,scale:1.6});
      sliceAnim={block:{...missBlock},vy:0,alpha:1};
      missBlock=null;
      state='playing'; // briefly, so effects render
      setTimeout(()=>{sliceAnim=null;endGame();},500);
    }
  }

  // Move block
  if((state==='ready'||state==='playing')&&moving){
    moving.x+=moveSpeed*moveDir*dt*60;
    if(moving.x+moving.w>W){moving.x=W-moving.w;moveDir=-1;}
    if(moving.x<0){moving.x=0;moveDir=1;}
  }

  // Camera
  targetCamY=getCameraY();camY+=(targetCamY-camY)*0.08;
  comboScale+=(1-comboScale)*0.08;
  // Tower wobble: oscillate and decay
  wobblePhase+=dt*8;
  wobbleAmp*=0.96;if(wobbleAmp<0.1)wobbleAmp=0;
  // Slice fall
  if(sliceAnim){sliceAnim.vy+=0.4;sliceAnim.block.y+=sliceAnim.vy;sliceAnim.alpha*=0.94;}

  updateEffects();

  // ── Background progress: how far up the tower? ──
  const progress=(blocks.length-1)/MAX_BLOCKS;

  // ── DRAW ──
  ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width/dpr,canvas.height/dpr);
  ctx.save();
  ctx.translate(VX+Math.round(shakeX*(Math.random()-0.5)),VY+Math.round(shakeY*(Math.random()-0.5)));
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  ctx.fillStyle=getBgGrad(progress);ctx.fillRect(0,0,W,H);

  if(state==='gameover'){drawStack(now);drawDangerVignette();drawGameOver(now);}
  else{
    drawStack(now);
    if(dangerLevel>0.05)drawDangerVignette();
    if(state==='ready')drawCTA(now);
    if(state==='playing'||state==='ready')drawHUD(now);
  }

  if(flashAlpha>0){ctx.fillStyle=flashColor;ctx.globalAlpha=flashAlpha;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  drawEffects();
  ctx.restore();
}
resize();initGame();requestAnimationFrame(update);
</script>
