function encodeWord(w){let s='';for(let i=0;i<w.length;i++)s+=String.fromCharCode(w.charCodeAt(i)^42);return btoa(s)}
function decodeWord(h){try{let d=atob(h),w='';for(let i=0;i<d.length;i++)w+=String.fromCharCode(d.charCodeAt(i)^42);w=w.toUpperCase();return ANSWERS.includes(w)?w:null}catch(e){return null}}

// ── Canvas Setup ──
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H,u,dpr;

function resize(){
  dpr=window.devicePixelRatio||1;
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // On tall mobile screens, W is tiny vs H — use a boosted unit
  const aspect=H/W;
  u=aspect>1.4?W*1.15:Math.min(W,H);
}
window.addEventListener('resize',resize);
resize();

// ── Audio ──
let audioCtx=null;
function initAudio(){if(audioCtx)return;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function playTone(freq,dur,vol,type){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,audioCtx.currentTime);
  g.gain.setValueAtTime(vol||0.12,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+(dur||0.15));
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+(dur||0.15));
}
function playCorrect(){playTone(880,0.1,0.1,'square');setTimeout(()=>playTone(1100,0.15,0.1,'square'),80)}
function playPresent(){playTone(520,0.1,0.08,'triangle')}
function playAbsent(){playTone(220,0.08,0.06,'sine')}
function playWin(){[0,100,200,300,400].forEach((d,i)=>setTimeout(()=>playTone(440+i*110,0.2,0.1,'square'),d))}
function playLose(){playTone(200,0.3,0.1,'sawtooth');setTimeout(()=>playTone(150,0.4,0.1,'sawtooth'),200)}
function playKey(){playTone(600,0.04,0.05,'sine')}
function playInvalid(){playTone(180,0.15,0.1,'sawtooth');setTimeout(()=>playTone(160,0.15,0.1,'sawtooth'),100)}
function playCountdown(n){playTone(n===0?880:440,n===0?0.2:0.1,0.1,'square')}

// ── Pick Word ──
function pickWord(){
  const hash=window.location.hash.slice(1);
  if(hash){
    const decoded=decodeWord(hash);
    if(decoded){target=decoded;challengeMode=true;return}
  }
  target=ANSWERS[Math.floor(Math.random()*ANSWERS.length)];
  challengeMode=false;
}

// ── Check Guess ──
function checkGuess(guess){
  const result=Array(WORD_LEN).fill('absent');
  const targetArr=target.split('');
  const guessArr=guess.split('');
  // First pass: correct
  for(let i=0;i<WORD_LEN;i++){
    if(guessArr[i]===targetArr[i]){result[i]='correct';targetArr[i]='_';guessArr[i]='_'}
  }
  // Second pass: present
  for(let i=0;i<WORD_LEN;i++){
    if(guessArr[i]==='_')continue;
    const idx=targetArr.indexOf(guessArr[i]);
    if(idx!==-1){result[i]='present';targetArr[idx]='_'}
  }
  return result;
}

function isValidWord(w){return VALID.has(w)}

function submitGuess(){
  if(currentInput.length!==WORD_LEN)return;
  if(!isValidWord(currentInput)){
    invalidWordShake=15;
    playInvalid();
    vib(40);
    addFloat('Not in word list','#ff6b6b');
    return;
  }
  const result=checkGuess(currentInput);
  guesses.push({word:currentInput,result});
  // Update key states
  for(let i=0;i<WORD_LEN;i++){
    const l=currentInput[i],r=result[i];
    if(r==='correct')keyStates[l]='correct';
    else if(r==='present'&&keyStates[l]!=='correct')keyStates[l]='present';
    else if(r==='absent'&&!keyStates[l])keyStates[l]='absent';
  }
  // Start reveal animation
  revealRow=guesses.length-1;
  revealCol=0;
  revealTimer=0;
  currentInput='';
  // Check win/lose after reveal completes (handled in update)
}

function addFloat(text,color){
  floatingTexts.push({text,color,y:H*0.35,alpha:1,t:0});
}

// ── Scoring ──
function calcScore(){
  if(!wonGame)return 0;
  const attempts=guesses.length;
  const scores=[100,92,78,60,40,20];
  return scores[attempts-1]||0;
}

function getGrade(score){
  if(score>=98)return'S';if(score>=92)return'A+';if(score>=85)return'A';
  if(score>=78)return'A-';if(score>=70)return'B+';if(score>=60)return'B';
  if(score>=50)return'B-';if(score>=42)return'C+';if(score>=35)return'C';
  if(score>=28)return'C-';if(score>=22)return'D+';if(score>=15)return'D';
  if(score>=8)return'D-';return'F';
}

function getGradeColor(grade){
  if(grade==='S')return'#ffd700';if(grade.startsWith('A'))return'#538d4e';
  if(grade.startsWith('B'))return'#b59f3b';if(grade.startsWith('C'))return'#cc8833';
  if(grade.startsWith('D'))return'#cc5544';return'#aa3333';
}

// ── Share ──
function getShareText(){
  const score=calcScore();
  const grade=getGrade(score);
  const attempts=wonGame?guesses.length+'\/6':'X\/6';
  let grid='';
  for(const g of guesses){
    grid+=g.result.map(r=>r==='correct'?'🟩':r==='present'?'🟨':'⬛').join('')+'\n';
  }
  const encoded=encodeWord(target);
  const baseUrl='https://fullclear315.github.io/html-games/hunch.html';
  return`🔤 HUNCH\n\n${grade} — ${score}/100\n\n${grid}\n⏱ ${attempts} attempts\n\nCan you beat my score?\n${baseUrl}#${encoded}`;
}

function shareResult(){
  const text=getShareText();
  if(navigator.share){
    navigator.share({text}).catch(()=>{});
    return;
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      addFloat('Copied to clipboard!','#538d4e');
    }).catch(()=>{
      execCopyFallback(text);
    });
    return;
  }
  execCopyFallback(text);
}

function execCopyFallback(text){
  try{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.cssText='position:fixed;left:-9999px;top:-9999px';
    document.body.appendChild(ta);
    ta.focus();ta.select();
    ta.setSelectionRange(0,ta.value.length);
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);
    if(ok){addFloat('Copied to clipboard!','#538d4e');return;}
  }catch(e){}
  showCopyOverlay(text);
}

function showCopyOverlay(text){
  const existing=document.getElementById('copy-overlay');
  if(existing)existing.remove();
  const ov=document.createElement('div');
  ov.id='copy-overlay';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;padding:20px';
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.readOnly=true;
  ta.style.cssText='width:90%;max-width:360px;height:220px;background:#2d2d4a;color:#eaeaf0;border:1px solid #4a4a6a;border-radius:8px;padding:12px;font-size:14px;font-family:monospace;resize:none';
  const btn=document.createElement('button');
  btn.textContent='Close';
  btn.style.cssText='margin-top:12px;padding:10px 32px;background:#538d4e;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;font-family:-apple-system,sans-serif';
  btn.onclick=()=>ov.remove();
  const hint=document.createElement('div');
  hint.textContent='Select all and copy manually';
  hint.style.cssText='color:#8888aa;font-size:13px;margin-bottom:8px;font-family:-apple-system,sans-serif';
  ov.appendChild(hint);
  ov.appendChild(ta);
  ov.appendChild(btn);
  document.body.appendChild(ov);
  ta.focus();ta.select();
}

// ── Layout Calculations ──
function getGridLayout(){
  const maxW=Math.min(W*0.88,380);
  const gap=u*0.012;
  const tileSize=Math.min((maxW-gap*(WORD_LEN-1))/WORD_LEN, u*0.12);
  const gridW=tileSize*WORD_LEN+gap*(WORD_LEN-1);
  const gridH=tileSize*MAX_GUESSES+gap*(MAX_GUESSES-1);
  const sx=(W-gridW)/2;
  const sy=u*0.1;
  return{sx,sy,tileSize,gap,gridW,gridH};
}

function getKeyboardLayout(){
  const rows=[
    'QWERTYUIOP'.split(''),
    'ASDFGHJKL'.split(''),
    ['ENT','Z','X','C','V','B','N','M','⌫']
  ];
  const maxW=Math.min(W*0.97,460);
  const kGap=u*0.007;
  const kh=u*0.075;
  const totalH=kh*3+kGap*2;
  const baseY=H-totalH-u*0.02;
  const keys=[];
  for(let r=0;r<rows.length;r++){
    const row=rows[r];
    const isBottom=r===2;
    const normalCount=isBottom?row.length-2:row.length;
    const specialW=isBottom?maxW*0.15:0;
    const specialCount=isBottom?2:0;
    const availW=maxW-specialW*specialCount-kGap*(row.length-1);
    const kw=availW/normalCount;
    let x=(W-maxW)/2;
    if(r===1)x+=(maxW-kw*row.length-kGap*(row.length-1))/2;
    const y=baseY+r*(kh+kGap);
    for(let c=0;c<row.length;c++){
      const letter=row[c];
      const isSpecial=letter==='ENT'||letter==='⌫';
      const w=isSpecial?specialW:kw;
      keys.push({letter,x,y,w,h:kh});
      x+=w+kGap;
    }
  }
  return{keys,baseY,totalH};
}

// ── Drawing ──
function drawTile(x,y,size,letter,state,animProgress){
  const r=u*0.008;
  // Flip animation
  let scaleY=1;
  if(animProgress!==undefined&&animProgress<1){
    scaleY=Math.abs(Math.cos(animProgress*Math.PI));
  }
  ctx.save();
  ctx.translate(x+size/2,y+size/2);
  ctx.scale(1,scaleY);
  ctx.translate(-(x+size/2),-(y+size/2));

  let bg=COL.tileBg;
  let border=letter?COL.tileBorder:COL.tileBg;
  const showResult=animProgress===undefined||animProgress>=0.5;
  if(state&&showResult){
    bg=state==='correct'?COL.correct:state==='present'?COL.present:COL.absent;
    border=bg;
  }

  ctx.fillStyle=bg;
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+size-r,y);ctx.quadraticCurveTo(x+size,y,x+size,y+r);
  ctx.lineTo(x+size,y+size-r);ctx.quadraticCurveTo(x+size,y+size,x+size-r,y+size);
  ctx.lineTo(x+r,y+size);ctx.quadraticCurveTo(x,y+size,x,y+size-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.fill();

  if(border!==bg){
    ctx.strokeStyle=border;ctx.lineWidth=2;ctx.stroke();
  }

  if(letter&&scaleY>0.1){
    const displayLetter=(state&&showResult)?letter:(!state?letter:'');
    if(displayLetter){
      ctx.fillStyle=COL.white;
      ctx.font='bold '+Math.round(size*0.52)+'px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(displayLetter,x+size/2,y+size/2+size*0.02);
    }
  }
  ctx.restore();
}

function drawKeyboard(){
  const{keys}=getKeyboardLayout();
  keyPositions=keys;
  const r=u*0.006;
  for(const k of keys){
    let bg=COL.keyBg;
    const st=keyStates[k.letter];
    if(st==='correct')bg=COL.correct;
    else if(st==='present')bg=COL.present;
    else if(st==='absent')bg=COL.absent;
    if(k.letter==='ENT')bg=COL.enterBg;

    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.moveTo(k.x+r,k.y);ctx.lineTo(k.x+k.w-r,k.y);
    ctx.quadraticCurveTo(k.x+k.w,k.y,k.x+k.w,k.y+r);
    ctx.lineTo(k.x+k.w,k.y+k.h-r);
    ctx.quadraticCurveTo(k.x+k.w,k.y+k.h,k.x+k.w-r,k.y+k.h);
    ctx.lineTo(k.x+r,k.y+k.h);
    ctx.quadraticCurveTo(k.x,k.y+k.h,k.x,k.y+k.h-r);
    ctx.lineTo(k.x,k.y+r);
    ctx.quadraticCurveTo(k.x,k.y,k.x+r,k.y);
    ctx.fill();

    ctx.fillStyle=st==='absent'?'#888899':COL.keyText;
    const label=k.letter==='ENT'?'↵':k.letter;
    const fs=k.letter==='ENT'||k.letter==='⌫'?u*0.04:u*0.032;
    ctx.font='bold '+Math.round(fs)+'px -apple-system,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(label,k.x+k.w/2,k.y+k.h/2+1);
  }
}

function drawGrid(){
  const{sx,sy,tileSize,gap}=getGridLayout();
  let shakeX=0;
  if(invalidWordShake>0){
    shakeX=Math.sin(invalidWordShake*0.8)*u*0.015*(invalidWordShake/15);
  }
  for(let row=0;row<MAX_GUESSES;row++){
    const rowShakeX=(row===guesses.length&&invalidWordShake>0)?shakeX:0;
    for(let col=0;col<WORD_LEN;col++){
      const x=sx+col*(tileSize+gap)+rowShakeX;
      const y=sy+row*(tileSize+gap);
      if(row<guesses.length){
        const g=guesses[row];
        let animP=undefined;
        if(row===revealRow){
          if(col<revealCol)animP=undefined;// already revealed
          else if(col===revealCol)animP=Math.min(revealTimer/12,1);
          else animP=0;// not yet
          if(col<=revealCol&&animP===undefined)animP=undefined;
          if(col>revealCol){drawTile(x,y,tileSize,g.word[col],null);continue;}
        }
        drawTile(x,y,tileSize,g.word[col],g.result[col],animP);
      }else if(row===guesses.length&&gameState==='playing'){
        const letter=currentInput[col]||'';
        drawTile(x,y,tileSize,letter,null);
      }else{
        drawTile(x,y,tileSize,'',null);
      }
    }
  }
}

function drawHUD(){
  const fs=Math.round(u*0.048);
  ctx.font='bold '+fs+'px -apple-system,sans-serif';
  ctx.textAlign='center';
  ctx.fillStyle=COL.text;
  ctx.fillText('HUNCH',W/2,u*0.06);

  if(challengeMode&&gameState==='playing'){
    ctx.font=Math.round(u*0.026)+'px -apple-system,sans-serif';
    ctx.fillStyle=COL.textDim;
    ctx.fillText('Challenge Mode',W/2,u*0.088);
  }
}

function drawFloats(){
  for(let i=floatingTexts.length-1;i>=0;i--){
    const f=floatingTexts[i];
    f.t++;f.y-=0.8;f.alpha=Math.max(0,1-f.t/60);
    if(f.alpha<=0){floatingTexts.splice(i,1);continue;}
    ctx.globalAlpha=f.alpha;
    ctx.font='bold '+Math.round(u*0.035)+'px -apple-system,sans-serif';
    ctx.textAlign='center';ctx.fillStyle=f.color;
    ctx.fillText(f.text,W/2,f.y);
    ctx.globalAlpha=1;
  }
}

function drawIntro(){
  ctx.fillStyle=COL.bg;ctx.fillRect(0,0,W,H);
  const cx=W/2;
  let y=H*0.25;

  ctx.font='bold '+Math.round(u*0.12)+'px -apple-system,sans-serif';
  ctx.textAlign='center';ctx.fillStyle=COL.text;
  ctx.fillText('HUNCH',cx,y);y+=u*0.1;

  // Draw sample tiles
  const sample=['W','O','R','D','L'];
  const states=['correct','present','absent','absent','correct'];
  const ts=u*0.1;const gap=u*0.012;
  const startX=cx-(ts*5+gap*4)/2;
  for(let i=0;i<5;i++){
    drawTile(startX+i*(ts+gap),y,ts,sample[i],states[i]);
  }
  y+=ts+u*0.09;

  ctx.font=Math.round(u*0.038)+'px -apple-system,sans-serif';
  ctx.fillStyle=COL.textDim;
  ctx.fillText('Guess the 5-letter word in 6 tries',cx,y);y+=u*0.06;

  // Color legend
  const legendFS=Math.round(u*0.03);
  ctx.font=legendFS+'px -apple-system,sans-serif';
  const legends=[
    {color:COL.correct,text:'🟩 Correct spot'},
    {color:COL.present,text:'🟨 Wrong spot'},
    {color:COL.absent,text:'⬛ Not in word'}
  ];
  for(const l of legends){
    ctx.fillStyle=l.color;
    ctx.fillText(l.text,cx,y);y+=u*0.045;
  }

  if(challengeMode){
    y+=u*0.03;
    ctx.fillStyle=COL.gold;
    ctx.font='bold '+Math.round(u*0.032)+'px -apple-system,sans-serif';
    ctx.fillText('🏆 Challenge Mode — beat their score!',cx,y);
    y+=u*0.05;
  }

  // Tap to start button — anchor from bottom
  const btnW=Math.min(W*0.7,280);const btnH=u*0.08;
  const bx=cx-btnW/2;
  const by=Math.max(y+u*0.04,H-btnH-H*0.12);
  ctx.fillStyle=COL.correct;
  roundRect(bx,by,btnW,btnH,u*0.012);ctx.fill();
  ctx.fillStyle=COL.white;
  ctx.font='bold '+Math.round(u*0.036)+'px -apple-system,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('Tap to Play',cx,by+btnH/2);
  ctx.textBaseline='alphabetic';

  introBtn={x:bx,y:by,w:btnW,h:btnH};
}

let introBtn=null;
let gameOverBtns={play:null,share:null};

function drawCountdown(){
  ctx.fillStyle=COL.bg;ctx.fillRect(0,0,W,H);
  drawGrid();
  drawKeyboard();
  drawHUD();

  // Overlay
  ctx.fillStyle='rgba(26,26,46,0.85)';ctx.fillRect(0,0,W,H);

  const label=countdownVal>0?countdownVal.toString():'GO!';
  const scale=1+(countdownTimer%20)/20*0.1;
  ctx.save();
  ctx.translate(W/2,H/2);ctx.scale(scale,scale);
  ctx.font='bold '+Math.round(u*0.15)+'px -apple-system,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=countdownVal>0?COL.text:COL.correct;
  ctx.fillText(label,0,0);
  ctx.restore();
}

function drawGameOver(){
  ctx.fillStyle=COL.bg;ctx.fillRect(0,0,W,H);
  const cx=W/2;
  const score=calcScore();
  const grade=getGrade(score);
  const maxContentW=Math.min(W*0.85,400);

  let y=u*0.05;

  // Title
  ctx.font='bold '+Math.round(u*0.035)+'px -apple-system,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='top';ctx.fillStyle=COL.textDim;
  ctx.fillText('HUNCH',cx,y);y+=u*0.055;

  // Grade
  const gradeFS=grade.length>1?u*0.1:u*0.13;
  ctx.font='bold '+Math.round(gradeFS)+'px -apple-system,sans-serif';
  ctx.textBaseline='top';
  ctx.fillStyle=getGradeColor(grade);
  ctx.fillText(grade,cx,y);y+=gradeFS+u*0.02;

  // Score
  ctx.font='bold '+Math.round(u*0.055)+'px -apple-system,sans-serif';
  ctx.textBaseline='top';
  ctx.fillStyle=COL.text;
  ctx.fillText(score+' / 100',cx,y);y+=u*0.08;

  // The word
  if(!wonGame){
    ctx.font=Math.round(u*0.028)+'px -apple-system,sans-serif';
    ctx.textBaseline='top';ctx.fillStyle=COL.textDim;
    ctx.fillText('The word was',cx,y);y+=u*0.038;
    ctx.font='bold '+Math.round(u*0.045)+'px -apple-system,sans-serif';
    ctx.fillStyle=COL.correct;
    ctx.fillText(target,cx,y);y+=u*0.06;
  }else{
    y+=u*0.01;
  }
  ctx.textBaseline='alphabetic';

  // Mini grid
  const miniTile=u*0.04;const miniGap=u*0.005;
  const miniGridW=miniTile*WORD_LEN+miniGap*(WORD_LEN-1);
  const miniSX=cx-miniGridW/2;
  for(let r=0;r<guesses.length;r++){
    for(let c=0;c<WORD_LEN;c++){
      const mx=miniSX+c*(miniTile+miniGap);
      const my=y+r*(miniTile+miniGap);
      const st=guesses[r].result[c];
      ctx.fillStyle=st==='correct'?COL.correct:st==='present'?COL.present:COL.absent;
      roundRect(mx,my,miniTile,miniTile,u*0.004);ctx.fill();
    }
  }
  y+=guesses.length*(miniTile+miniGap)+u*0.04;

  // Stats
  const elapsed=Math.round((endTime-startTime)/1000);
  const statsFS=Math.round(u*0.028);
  ctx.font=statsFS+'px -apple-system,sans-serif';
  ctx.fillStyle=COL.textDim;
  const stats=[
    ['Attempts',wonGame?guesses.length+'/6':'X/6'],
    ['Time',elapsed+'s'],
    ['Result',wonGame?'Solved ✓':'Failed ✗']
  ];
  const colW=maxContentW/2;
  const statsSX=cx-maxContentW/2;
  for(let i=0;i<stats.length;i++){
    const sy2=y+i*u*0.04;
    ctx.textAlign='left';ctx.fillStyle=COL.textDim;
    ctx.fillText(stats[i][0],statsSX,sy2);
    ctx.textAlign='right';ctx.fillStyle=COL.text;
    ctx.fillText(stats[i][1],statsSX+maxContentW,sy2);
  }
  y+=stats.length*u*0.04+u*0.05;

  // Buttons
  const btnW=(maxContentW-u*0.02)/2;
  const btnH=u*0.065;
  const bx1=cx-maxContentW/2;
  const bx2=cx+u*0.01;
  const by=Math.min(y,H-btnH-u*0.04);

  // Play Again
  ctx.fillStyle=COL.correct;
  roundRect(bx1,by,btnW,btnH,u*0.01);ctx.fill();
  ctx.fillStyle=COL.white;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='bold '+Math.round(u*0.028)+'px -apple-system,sans-serif';
  ctx.fillText('Play Again',bx1+btnW/2,by+btnH/2);

  // Share
  ctx.fillStyle=COL.keyBg;
  roundRect(bx2,by,btnW,btnH,u*0.01);ctx.fill();
  ctx.fillStyle=COL.white;
  ctx.fillText('Share',bx2+btnW/2,by+btnH/2);
  ctx.textBaseline='alphabetic';

  gameOverBtns={
    play:{x:bx1,y:by,w:btnW,h:btnH},
    share:{x:bx2,y:by,w:btnW,h:btnH}
  };
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

// ── Game Logic ──
function startGame(){
  guesses=[];currentInput='';keyStates={};
  floatingTexts=[];wonGame=false;
  revealRow=-1;revealCol=-1;
  invalidWordShake=0;
  pickWord();
  gameState='countdown';countdownVal=3;countdownTimer=0;
}

function finishReveal(){
  const lastGuess=guesses[guesses.length-1];
  const allCorrect=lastGuess.result.every(r=>r==='correct');
  if(allCorrect){
    wonGame=true;gameState='gameover';
    endTime=performance.now();
    playWin();vib([20,30,20,30,40]);
    dispatchComplete();
  }else if(guesses.length>=MAX_GUESSES){
    wonGame=false;gameState='gameover';
    endTime=performance.now();
    playLose();vib([40,50,60]);
    dispatchComplete();
  }else{
    // Per-row feedback
    const correctCount=lastGuess.result.filter(r=>r==='correct').length;
    if(correctCount>=4)addFloat('So close!',COL.correct);
    else if(correctCount>=3)addFloat('Getting warm!',COL.present);
  }
  revealRow=-1;
}

function dispatchComplete(){
  const score=calcScore();
  window.dispatchEvent(new CustomEvent('gameComplete',{
    detail:{
      score,maxScore:100,
      duration:Math.round((endTime-startTime)/1000),
      won:wonGame
    }
  }));
}

// ── Input ──
function handleKeyPress(letter){
  if(gameState!=='playing')return;
  if(revealRow>=0)return;// animating
  playKey();
  if(letter==='ENT'){
    submitGuess();
  }else if(letter==='⌫'){
    currentInput=currentInput.slice(0,-1);
  }else if(currentInput.length<WORD_LEN&&/^[A-Z]$/.test(letter)){
    currentInput+=letter;
    vib(8);
  }
}

let lastInputTime=0;
function handleCanvasInput(e){
  const now=performance.now();
  if(now-lastInputTime<50)return;
  lastInputTime=now;
  e.preventDefault();
  initAudio();

  const t=e.touches?e.touches[0]:e;
  const rect=canvas.getBoundingClientRect();
  const x=t.clientX-rect.left;
  const y=t.clientY-rect.top;

  // Ignore input if copy overlay is showing
  if(document.getElementById('copy-overlay'))return;

  if(gameState==='intro'){
    if(introBtn&&x>=introBtn.x&&x<=introBtn.x+introBtn.w&&y>=introBtn.y&&y<=introBtn.y+introBtn.h){
      startGame();
    }
    return;
  }

  if(gameState==='gameover'){
    const p=gameOverBtns.play;
    const s=gameOverBtns.share;
    if(p&&x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.h){
      // Reset challenge mode for replay
      window.location.hash='';
      challengeMode=false;
      startGame();
    }
    if(s&&x>=s.x&&x<=s.x+s.w&&y>=s.y&&y<=s.y+s.h){
      shareResult();
    }
    return;
  }

  if(gameState==='playing'){
    for(const k of keyPositions){
      if(x>=k.x&&x<=k.x+k.w&&y>=k.y&&y<=k.y+k.h){
        handleKeyPress(k.letter);
        return;
      }
    }
  }
}

canvas.addEventListener('touchstart',handleCanvasInput,{passive:false});
canvas.addEventListener('mousedown',handleCanvasInput);

// Physical keyboard
document.addEventListener('keydown',e=>{
  if(gameState==='intro'){if(e.key==='Enter'){initAudio();startGame()}return;}
  if(gameState==='gameover'){if(e.key==='Enter'){window.location.hash='';startGame()}return;}
  if(gameState!=='playing')return;
  if(e.key==='Enter')handleKeyPress('ENT');
  else if(e.key==='Backspace')handleKeyPress('⌫');
  else if(/^[a-zA-Z]$/.test(e.key))handleKeyPress(e.key.toUpperCase());
});

// ── Update & Render Loop ──
let lastFrame=0;
function update(){
  if(invalidWordShake>0)invalidWordShake--;

  if(gameState==='countdown'){
    countdownTimer++;
    if(countdownTimer%20===0){
      playCountdown(countdownVal);
      countdownVal--;
      if(countdownVal<0){
        gameState='playing';
        startTime=performance.now();
      }
    }
  }

  if(revealRow>=0){
    revealTimer++;
    if(revealTimer>=12){
      // Play sound for this tile
      const st=guesses[revealRow].result[revealCol];
      if(st==='correct'){playCorrect();vib(10);}
      else if(st==='present'){playPresent();vib(15);}
      else{playAbsent();}
      revealCol++;
      revealTimer=0;
      if(revealCol>=WORD_LEN){
        finishReveal();
      }
    }
  }
}

function render(){
  resize();
  if(gameState==='intro'){drawIntro();drawFloats();return;}
  if(gameState==='countdown'){drawCountdown();return;}
  if(gameState==='gameover'){drawGameOver();drawFloats();return;}

  // Playing
  ctx.fillStyle=COL.bg;ctx.fillRect(0,0,W,H);
  drawHUD();
  drawGrid();
  drawKeyboard();
  drawFloats();
}

function loop(ts){
  requestAnimationFrame(loop);
  update();
  render();
}

pickWord();
requestAnimationFrame(loop);
</script>
